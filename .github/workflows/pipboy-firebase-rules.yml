name: Pip-Boy Firebase rules
on:
  push:
    paths: ['PipBoy3000/firebase/**', '.github/workflows/pipboy-firebase-rules.yml']
  pull_request:
    paths: ['PipBoy3000/firebase/**', '.github/workflows/pipboy-firebase-rules.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: PipBoy3000/firebase/rules-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: PipBoy3000/firebase/rules-test/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - name: Emulator-Tests
        shell: bash
        run: |
          if timeout 60s npm test > /tmp/pipboy-rules.log 2>&1; then
            cat /tmp/pipboy-rules.log
          else
            cat /tmp/pipboy-rules.log
            python3 -c "from pathlib import Path; s=Path('/tmp/pipboy-rules.log').read_text()[-3500:]; print('::error title=Firebase rules test::'+s.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
            exit 1
          fi
