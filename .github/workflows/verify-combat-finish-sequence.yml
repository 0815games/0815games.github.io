name: Verify integrated combat finish sequence
# rerun marker: 2026-10-19-1202
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-combat-finish-sequence.yml'
      - 'rpg/tests/combat-finish-sequence.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: verify-combat-finish-sequence
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'pipboy3003/pipboy3003.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all regression tests
        run: |
          set -euo pipefail
          for f in rpg/tests/*.mjs; do
            echo "Running $f"
            node "$f"
          done
      - name: Document verified sequence
        shell: python
        run: |
          from pathlib import Path
          log = Path('rpg/change.log')
          s = log.read_text()
          section = '''## 2026-10-19 – T13 Push 3: integrierte Abschlussreihenfolge geprüft
          - Neuer Integrationstest `tests/combat-finish-sequence.mjs` prüft `combat-effects.js` und `combat-reward-feedback.js` gemeinsam: letzter Treffer, Gegnerniederlage, 850-ms-Cleanup, EP-Sieganzeige über Kampffenster- und Level-Up-Übergang, keine doppelte EP-Anzeige und keine nachlaufenden Kampfzahlen.
          - Bossbeute-Übergang ist als Anzeigeplatz im Integrationstest berücksichtigt; kein vollständiger Boss-End-to-End-Lauf und keine Browser-/Geräte-/Firebase-Abnahme.
          - Keine Spielcode-, Balance-, Speicher- oder Versionsänderung; Spielversion bleibt v0.5.26.
          - Push 2 ist mit Commit `d15165e0f81b4fdc01bd8f981d97694fb2188679` veröffentlicht: Klassenfähigkeiten und Gift nutzen denselben 850-ms-Abschluss.
          - T13 bleibt offen für echte mobile/Desktop-Abnahme, Deploy-Prüfung und vollständige Bossbeute-Reihenfolge.
          '''
          section = '\n'.join(line.strip() for line in section.strip().splitlines()) + '\n'
          marker = '# CHANGELOG – Chroniken der Schattengruft\n\n'
          assert s.startswith(marker)
          if 'T13 Push 3: integrierte Abschlussreihenfolge geprüft' not in s:
              s = s.replace(marker, marker + section + '\n', 1)
          log.write_text(s)
          todo = Path('rpg/to-do.md')
          t = todo.read_text()
          old2 = '- [ ] Push 2: Klassenfaehigkeiten und Gift an denselben 850-ms-Standard anbinden; noch nicht durch Push 1 umgesetzt.'
          new2 = '- [x] Push 2: Klassenfaehigkeiten und Gift an denselben 850-ms-Standard anbinden. Codecommit `d15165e0f81b4fdc01bd8f981d97694fb2188679`; Integrationstest ergaenzt, echte Abnahme offen.'
          if old2 in t:
              t = t.replace(old2, new2)
          old3 = '- [ ] Push 3: gesamte Sieg-/Level-Up-/Bossbeute-Reihenfolge und doppelte/nachlaufende Anzeigen integriert pruefen. T13 bleibt offen. Grafik-/Ruestkammer-Restarbeiten, v0.6.0 und anschliessend S01c getrennt weiterfuehren; S01b bleibt abgeschlossen.'
          new3 = '- [ ] Push 3: integrierte Reihenfolge mit `tests/combat-finish-sequence.mjs` geprüft; echte mobile/Desktop-/Bossbeute-Abnahme und Deploy bleiben offen. T13 bleibt offen. Grafik-/Ruestkammer-Restarbeiten, v0.6.0 und anschliessend S01c getrennt weiterfuehren; S01b bleibt abgeschlossen.'
          if old3 in t:
              t = t.replace(old3, new3)
          todo.write_text(t)
      - name: Commit verification documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rpg/change.log rpg/to-do.md
          if git diff --cached --quiet; then
            echo "No documentation changes"
          else
            git commit -m "docs: record integrated combat finish sequence verification"
            git push
          fi
