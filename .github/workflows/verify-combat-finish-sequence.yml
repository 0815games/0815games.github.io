name: Verify combat finish sequence
# manual scope fix: combat finish only
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-combat-finish-sequence.yml'
      - 'rpg/tests/combat-finish-sequence.mjs'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: verify-combat-finish-sequence
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'pipboy3003/pipboy3003.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run all regression tests
        run: |
          set -euo pipefail
          for f in rpg/tests/*.mjs; do
            echo "Running $f"
            node "$f"
          done
      - name: Document verified combat finish sequence
        shell: python
        run: |
          from pathlib import Path
          log = Path('rpg/change.log')
          s = log.read_text()
          section = '''## 2026-10-19 – T13 Push 3: Kampfabschluss-Sequenz geprüft
          - Der vereinfachte Sequenztest prüft den tatsächlichen Kampfabschluss: tödlicher Angriff, Gegnerniederlage und 850-ms-Cleanup.
          - EP-, Level-Up- und Bossbeute-Interaktion bleiben davon getrennt und sind nicht als integriert geprüft dokumentiert.
          - Keine Spielcode-, Balance-, Speicher- oder Versionsänderung; Spielversion bleibt v0.5.26.
          - Push 2 bleibt mit Commit `d15165e0f81b4fdc01bd8f981d97694fb2188679` veröffentlicht.
          - T13 bleibt offen für echte mobile/Desktop-Abnahme, Deploy-Prüfung und die gesamte Sieg-/Level-Up-/Bossbeute-Reihenfolge.
          '''
          section = '\n'.join(line.strip() for line in section.strip().splitlines()) + '\n'
          marker = '# CHANGELOG – Chroniken der Schattengruft\n\n'
          assert s.startswith(marker)
          if 'T13 Push 3: Kampfabschluss-Sequenz geprüft' not in s:
              s = s.replace(marker, marker + section + '\n', 1)
          log.write_text(s)
          todo = Path('rpg/to-do.md')
          t = todo.read_text()
          old = '- [ ] Push 3: gesamte Sieg-/Level-Up-/Bossbeute-Reihenfolge und doppelte/nachlaufende Anzeigen integriert pruefen. T13 bleibt offen. Grafik-/Ruestkammer-Restarbeiten, v0.6.0 und anschliessend S01c getrennt weiterfuehren; S01b bleibt abgeschlossen.'
          new = '- [ ] Push 3: Kampfabschluss-Sequenz geprüft; EP-, Level-Up- und Bossbeute-Interaktion sowie echte mobile/Desktop-/Bossbeute-Abnahme und Deploy bleiben offen. T13 bleibt offen. Grafik-/Ruestkammer-Restarbeiten, v0.6.0 und anschliessend S01c getrennt weiterfuehren; S01b bleibt abgeschlossen.'
          if old in t:
              t = t.replace(old, new)
          todo.write_text(t)
      - name: Commit verification documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rpg/change.log rpg/to-do.md
          if git diff --cached --quiet; then
            echo "No documentation changes"
          else
            git commit -m "docs: record combat finish sequence verification"
            git push
          fi
