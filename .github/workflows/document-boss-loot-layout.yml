name: Document boss loot layout and manual feedback
on:
  push:
    branches: [main]
    paths: ['.github/workflows/document-boss-loot-layout.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: document-boss-loot-layout
  cancel-in-progress: false
jobs:
  document:
    if: github.repository == 'pipboy3003/pipboy3003.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Insert addendum and preserve history
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          p = Path('rpg/change.log')
          original = p.read_bytes()
          text = original.decode('utf-8')
          header = '# CHANGELOG – Chroniken der Schattengruft\n\n'
          assert text.startswith(header), 'Unexpected changelog heading; no write performed'
          subprocess.run(['git', 'merge-base', '--is-ancestor', 'ea7d1504f6e2b6dbe4bb8b0c939babbf9d1ef598', 'HEAD'], check=True)
          section = '''## 2026-10-19 – Bossbeute: responsive Karten und getrennte Nebenaktionen
          - Anlass: Nutzer-Screenshot zeigt unruhige Button-Gestaltung, ungleichmäßige Titelumbrüche und direkt aneinanderliegende Nebenaktionen im Bossbeute-Dialog.
          - Veröffentlicht mit Commit `ea7d1504f6e2b6dbe4bb8b0c939babbf9d1ef598`.
          - Neue Datei `css/boss-loot.css`; in `index.html` nach dem bestehenden Hauptstylesheet über `css/boss-loot.css?rev=1` eingebunden. Bestehendes Hauptstylesheet unverändert.
          - Gestaltung auf den Bossbeute-Dialog begrenzt: einheitliche Systemschrift, abgestufte Titel-/Beschreibungstypografie, dunkle Karten mit goldenen Akzenten, gleichmäßige Innenabstände und gestreckte Karten innerhalb einer Zeile.
          - Belohnungen unter 800px einspaltig, ab 800px dreispaltig. Lange Gegenstandsnamen und Beschreibungen dürfen umbrechen.
          - Inventar- und Speicherbutton als separate Nebenaktionen mit Abstand und zurückhaltenderer Gestaltung. Unter 560px untereinander, ab 560px nebeneinander; Mindesthöhe 48px.
          - Dialogbreite und -höhe begrenzt; vh-Fallback, dvh und vertikale Safe Areas berücksichtigt. Gemeinsamer Dialog-Scrollbereich, Kompaktregeln für geringe Höhe.
          - Fokusrahmen ohne Layoutverschiebung, Hover nur auf geeigneten Geräten; reduzierte Bewegung und erzwungene Systemfarben berücksichtigt.
          - Keine Änderung an JavaScript, Auswahlablauf, Belohnungswerten, Inventarvergabe oder Speicherung. Spielversion weiterhin v0.5.26.
          - Prüfstand: Push erfolgreich. Keine automatisierten Layout-/Browserprüfungen für diesen CSS-Patch durchgeführt. Deployment und echte mobile/Desktop-Sichtprüfung offen.
          
          ## 2026-10-19 – T13: manuelle Funktionsrückmeldung und Abgrenzung
          - Nutzer bestätigt um 12:16 CEST, dass die letzten Änderungen funktionieren; um 12:17 CEST folgt nach der manuellen Prüfliste die Rückmeldung „Passt soweit alles“.
          - Als allgemeine manuelle Funktionsbestätigung für den geprüften Kampfabschluss festgehalten. Gerät, Browser und einzelne Prüfszenarien wurden nicht separat protokolliert; daraus keine vollständige automatisierte Integration-, Firebase- oder Speicherabnahme ableiten.
          - Verbleibender Nutzerbefund: Bossbeute-Fenster optisch unsauber. Darstellung separat mit CSS-Patch `ea7d150` überarbeitet; diese neue Gestaltung ist durch die vorherige Rückmeldung noch nicht abgenommen.
          - Automatisierter Push-3-Nachweis bleibt begrenzt: drei bestandene Sequenzprüfungen für Kampfabschluss, 850-ms-Cleanup und Wiederherstellung des Renderer-Hooks. Dokumentationscommit `0aeb8a9`.
          - Keine nachträgliche Behauptung eines bestandenen kombinierten EP-/Level-Up-/Bossbeute-Integrationstests. Die frühere Verkleinerung des Testumfangs bleibt nachvollziehbar dokumentiert.
          '''
          section = '\n'.join(line.strip() for line in section.strip().splitlines()) + '\n\n'
          if '## 2026-10-19 – Bossbeute: responsive Karten und getrennte Nebenaktionen' not in text:
              prefix = header.encode('utf-8')
              result = prefix + section.encode('utf-8') + original[len(prefix):]
              assert result[len(prefix) + len(section.encode('utf-8')):] == original[len(prefix):]
              p.write_bytes(result)
          Path('.github/workflows/document-boss-loot-layout.yml').unlink()
      - name: Commit changelog and remove one-time workflow
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rpg/change.log .github/workflows/document-boss-loot-layout.yml
          git commit -m 'docs: record boss loot CSS update and manual T13 feedback'
          git push origin HEAD:main
