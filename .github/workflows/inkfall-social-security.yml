name: INKFALL Social Security
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'inkfall/social/**'
      - 'inkfall/src/**'
      - 'inkfall/tests/**'
      - 'database.rules.json'
      - '.github/workflows/inkfall-social-security.yml'
  pull_request:
    paths:
      - 'inkfall/social/**'
      - 'inkfall/src/**'
      - 'inkfall/tests/**'
      - 'database.rules.json'
      - '.github/workflows/inkfall-social-security.yml'
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Model tests
        run: node --test inkfall/social/social-model.test.cjs
      - name: Existing INKFALL regression tests
        run: node --test inkfall/tests/*.test.cjs
      - name: Social UI component tests
        run: node --test inkfall/src/social/social-components.test.cjs
      - name: Install isolated emulator dependencies
        working-directory: inkfall/social
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Full ruleset in local emulator
        working-directory: inkfall/social
        run: npm run test:rules
      - name: Preserve emulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inkfall-social-security-logs
          path: |
            inkfall/social/*debug.log
            inkfall/social/package-lock.json
          if-no-files-found: ignore
