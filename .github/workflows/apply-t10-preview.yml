name: Apply T10 armory hero preview
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-t10-preview.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apply-t10-armory-preview
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'pipboy3003/pipboy3003.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed T10 presentation patch
        shell: python
        run: |
          import base64, zlib, hashlib
          data = zlib.decompress(base64.b64decode(''))
          assert hashlib.sha256(data).hexdigest() == 'f5f95b13005c08d527d4e17a80e1d8320203644aea8ca05acefb0240d66510b3'
          exec(compile(data, 'apply-t10-preview.py', 'exec'))
      - name: Syntax and regression checks
        run: |
          set -euo pipefail
          for f in rpg/js/systems/preparation-{hero,shop}.js rpg/js/core/version.js; do
            node --input-type=module --check < "$f"
          done
          for f in rpg/tests/*.mjs; do
            echo "Running $f"
            node "$f"
          done
          git diff --check
      - name: Commit T10 and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rpg/js/systems/preparation-hero.js rpg/js/systems/preparation-shop.js rpg/js/core/version.js rpg/css/preparation-hero.css rpg/index.html rpg/tests/preparation-hero.mjs rpg/change.log rpg/to-do.md .github/workflows/apply-t10-preview.yml
          git commit -m 'feat: add T10 armory hero preview and stat cards'
          git push origin HEAD:main
