name: Apply ingame armory visual layout
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-armory-layout.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apply-ingame-armory-layout
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'pipboy3003/pipboy3003.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed visual patch
        shell: python
        run: |
          import base64, zlib, hashlib
          data = zlib.decompress(base64.b64decode(''))
          assert hashlib.sha256(data).hexdigest() == 'b96871d139b583eee635c9590ea859b35040e426c1a2a01e418ba846bb45ae14'
          exec(compile(data, 'apply-armory-layout.py', 'exec'))
      - name: Syntax and regression checks
        run: |
          set -euo pipefail
          for f in rpg/js/main.js rpg/js/systems/armory-preview.js; do
            node --input-type=module --check < "$f"
          done
          for f in rpg/tests/*.mjs; do
            echo "Running $f"
            node "$f"
          done
          git diff --check
      - name: Commit visual layout and remove workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rpg/js/main.js rpg/js/systems/armory-preview.js rpg/css/armory-layout.css rpg/index.html rpg/tests/armory-layout.mjs rpg/change.log rpg/to-do.md .github/workflows/apply-armory-layout.yml
          git commit -m 'feat: add ingame armory hero layout and equipment stat cards'
          git push origin HEAD:main
