name: Apply verified potion controls
on:
  push:
    branches: [main]
    paths: ['.github/workflows/apply-potions.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apply-potion-controls
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'pipboy3003/pipboy3003.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed patch with baseline checks
        shell: python
        run: |
          import base64, zlib, hashlib
          data = zlib.decompress(base64.b64decode(''))
          assert hashlib.sha256(data).hexdigest() == 'a412053a20d5f8eb6de06a2d5a3186da5a1ce33709095c0021cd9cc1286e89b8'
          exec(compile(data, 'apply-potions.py', 'exec'))
      - name: Run syntax and regression checks
        run: |
          set -euo pipefail
          for f in rpg/js/main.js rpg/js/systems/{potions,discard-ui,combat-effects,keyboard,responsive-ui,tutorial,combat-effects-bootstrap}.js rpg/js/core/version.js; do
            node --input-type=module --check < "$f"
          done
          for f in rpg/tests/*.mjs; do
            echo "Running $f"
            node "$f"
          done
          git diff --check
      - name: Commit tested changes and remove workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rpg .github/workflows/apply-potions.yml
          git commit -m 'fix: restore inventory potions and add split heal mana combat controls'
          git push origin HEAD:main
