name: Apply approved standard combat finish
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-combat-finish-standard.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: approved-combat-finish-standard
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'pipboy3003/pipboy3003.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded standard finish, run regressions, and push
        shell: python
        run: |
          import base64, lzma, hashlib
          data = lzma.decompress(base64.b64decode(''))
          assert hashlib.sha256(data).hexdigest() == 'ec5da7ec9182bc59712cb2f2cfc34304334f88622ab73f0c1b2631d10198cca7'
          exec(compile(data, 'approved-standard-finish.py', 'exec'))
