name: Iron Path guarded Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy only after the production cutover has been prepared'
        type: boolean
        default: false
      full_verification:
        description: 'After deployment, compare every game asset against the staged inventory'
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

# Do not cancel an in-flight Pages deployment. Control-record operations still
# require one coordinated operator; this cannot make Pages and RTDB atomic.
concurrency:
  group: ironpath-guarded-pages
  cancel-in-progress: false

jobs:
  pages:
    # A manual run can build locally on a GitHub runner without deploying. A
    # push is ignored until an owner explicitly sets the repository variable.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.IRONPATH_GUARDED_PAGES_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Retained game builds are reconstructed from pinned ancestors.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the full site and retained guarded game versions
        run: |
          node IronPath/release-tools/build-pages-site.mjs "$GITHUB_WORKSPACE" "$RUNNER_TEMP/ironpath-pages-output" \
            IronPath/release-tools/production-public-config.json IronPath/release-tools/pages-release-pins.json
      - name: Configure Pages
        if: ${{ github.ref == 'refs/heads/main' && vars.IRONPATH_GUARDED_PAGES_ENABLED == 'true' && (github.event_name == 'push' || inputs.deploy == true) }}
        uses: actions/configure-pages@v5
      - name: Refuse deployment if the current live build is not retained
        if: ${{ github.ref == 'refs/heads/main' && vars.IRONPATH_GUARDED_PAGES_ENABLED == 'true' && (github.event_name == 'push' || inputs.deploy == true) }}
        run: |
          node IronPath/release-tools/pages-safety.mjs control "$RUNNER_TEMP/ironpath-pages-output" \
            IronPath/release-tools/production-public-config.json IronPath/release-tools/pages-release-pins.json
      - name: Upload the Pages artifact
        if: ${{ github.ref == 'refs/heads/main' && vars.IRONPATH_GUARDED_PAGES_ENABLED == 'true' && (github.event_name == 'push' || inputs.deploy == true) }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/ironpath-pages-output
      - name: Deploy Pages
        id: deployment
        if: ${{ github.ref == 'refs/heads/main' && vars.IRONPATH_GUARDED_PAGES_ENABLED == 'true' && (github.event_name == 'push' || inputs.deploy == true) }}
        uses: actions/deploy-pages@v4
      - name: Compare the live launcher and critical files with the local artifact
        if: ${{ github.ref == 'refs/heads/main' && vars.IRONPATH_GUARDED_PAGES_ENABLED == 'true' && (github.event_name == 'push' || inputs.deploy == true) && inputs.full_verification != true }}
        run: |
          node IronPath/release-tools/pages-safety.mjs verify "$RUNNER_TEMP/ironpath-pages-output" \
            IronPath/release-tools/production-public-config.json IronPath/release-tools/pages-release-pins.json
      - name: Compare the live launcher and every game asset with the local artifact
        if: ${{ github.ref == 'refs/heads/main' && vars.IRONPATH_GUARDED_PAGES_ENABLED == 'true' && github.event_name == 'workflow_dispatch' && inputs.deploy == true && inputs.full_verification == true }}
        run: |
          node IronPath/release-tools/pages-safety.mjs verify "$RUNNER_TEMP/ironpath-pages-output" \
            IronPath/release-tools/production-public-config.json IronPath/release-tools/pages-release-pins.json --full
      - name: Recheck that the current live build remains present
        if: ${{ github.ref == 'refs/heads/main' && vars.IRONPATH_GUARDED_PAGES_ENABLED == 'true' && (github.event_name == 'push' || inputs.deploy == true) }}
        run: |
          node IronPath/release-tools/pages-safety.mjs control "$RUNNER_TEMP/ironpath-pages-output" \
            IronPath/release-tools/production-public-config.json IronPath/release-tools/pages-release-pins.json
