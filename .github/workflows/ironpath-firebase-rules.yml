name: Iron Path Firebase party rules
on:
  push:
    paths: ['IronPath/**', '.github/workflows/ironpath-firebase-rules.yml']
  pull_request:
    paths: ['IronPath/**', '.github/workflows/ironpath-firebase-rules.yml']
permissions:
  contents: read
jobs:
  database-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: IronPath/firebase/rules-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: IronPath/firebase/rules-test/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - name: Run emulator tests
        shell: bash
        run: |
          if npm test > rules-output.log 2>&1; then
            cat rules-output.log
          else
            cat rules-output.log
            python3 -c "from pathlib import Path; s=Path('rules-output.log').read_text()[-3500:]; print('::error title=Firebase emulator output::'+s.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
            exit 1
          fi

      - name: Run four-player combined rules tests
        shell: bash
        run: |
          if npm run test:four > four-rules-output.log 2>&1; then
            cat four-rules-output.log
          else
            cat four-rules-output.log
            python3 -c "from pathlib import Path; s=Path('four-rules-output.log').read_text().splitlines(); i=[n for n,l in enumerate(s) if l.startswith('not ok') or l.startswith('Error:')]; t='\n'.join('\n'.join(s[n:n+18]) for n in i) if i else '\n'.join(s[-30:]); print('::error title=Four-player emulator output::'+t[:3800].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
            exit 1
          fi

      - name: Run unified lobby rules tests
        shell: bash
        run: |
          if npm run test:unified > unified-output.log 2>&1; then
            cat unified-output.log
          else
            cat unified-output.log
            python3 -c "from pathlib import Path; s=Path('unified-output.log').read_text().splitlines(); i=[n for n,l in enumerate(s) if l.startswith('not ok') or l.startswith('Error:')]; t='\n'.join('\n'.join(s[n:n+18]) for n in i) if i else '\n'.join(s[-30:]); print('::error title=Unified emulator output::'+t[:3800].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
            exit 1
          fi
      - name: Run experimental host recovery rules tests
        shell: bash
        run: |
          if npm run test:recovery > recovery-output.log 2>&1; then
            cat recovery-output.log
          else
            cat recovery-output.log
            python3 -c "from pathlib import Path; s=Path('recovery-output.log').read_text().splitlines(); i=[n for n,l in enumerate(s) if l.startswith('not ok') or l.startswith('Error:')]; t='\n'.join('\n'.join(s[n:n+18]) for n in i) if i else '\n'.join(s[-30:]); print('::error title=Recovery emulator output::'+t[:3800].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
            exit 1
          fi
      - name: Run combined online recovery rules tests
        shell: bash
        run: |
          if npm run test:online > online-output.log 2>&1; then
            cat online-output.log
          else
            cat online-output.log
            python3 -c "from pathlib import Path; s=Path('online-output.log').read_text().splitlines(); i=[n for n,l in enumerate(s) if l.startswith('not ok') or l.startswith('Error:')]; t='\n'.join('\n'.join(s[n:n+18]) for n in i) if i else '\n'.join(s[-30:]); print('::error title=Combined online rules output::'+t[:3800].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
            exit 1
          fi
      - name: Run leaderboard rules tests
        shell: bash
        run: |
          if npm run test:leaderboards > leaderboard-output.log 2>&1; then
            cat leaderboard-output.log
          else
            cat leaderboard-output.log
            python3 -c "from pathlib import Path; s=Path('leaderboard-output.log').read_text()[-3500:]; print('::error title=Leaderboard emulator output::'+s.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
            exit 1
          fi
      - name: Run co-op invitation rules tests
        shell: bash
        run: |
          if npm run test:coop-invites > coop-invites-output.log 2>&1; then
            cat coop-invites-output.log
          else
            cat coop-invites-output.log
            python3 -c "from pathlib import Path; s=Path('coop-invites-output.log').read_text()[-3500:]; print('::error title=Co-op invitations emulator output::'+s.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
            exit 1
          fi
      - name: Run friend search rules tests
        shell: bash
        run: |
          if npm run test:friend-search > friend-search-output.log 2>&1; then
            cat friend-search-output.log
          else
            cat friend-search-output.log
            python3 -c "from pathlib import Path; s=Path('friend-search-output.log').read_text()[-3500:]; print('::error title=Friend search emulator output::'+s.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
            exit 1
          fi
      - name: Run friends rules tests
        shell: bash
        run: |
          if npm run test:friends > friends-output.log 2>&1; then
            cat friends-output.log
          else
            cat friends-output.log
            python3 -c "from pathlib import Path; s=Path('friends-output.log').read_text()[-3500:]; print('::error title=Friends emulator output::'+s.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
            exit 1
          fi
      - name: Run expanded doctrine rules tests
        shell: bash
        run: |
          if npm run test:doctrines > doctrine-output.log 2>&1; then
            cat doctrine-output.log
          else
            cat doctrine-output.log
            python3 -c "from pathlib import Path; s=Path('doctrine-output.log').read_text()[-3500:]; print('::error title=Doctrine emulator output::'+s.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
            exit 1
          fi
      - name: Run complete story rules tests
        shell: bash
        run: |
          if npm run test:story > story-output.log 2>&1; then
            cat story-output.log
          else
            cat story-output.log
            python3 -c "from pathlib import Path; s=Path('story-output.log').read_text().splitlines(); i=[n for n,l in enumerate(s) if l.startswith('not ok') or l.startswith('Error:')]; t='\n'.join('\n'.join(s[n:n+18]) for n in i) if i else '\n'.join(s[-30:]); print('::error title=Story rules output::'+t[:3800].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
            exit 1
          fi
      - name: Run campaign account rules tests
        shell: bash
        run: |
          if npm run test:campaign > campaign-output.log 2>&1; then
            cat campaign-output.log
          else
            cat campaign-output.log
            python3 -c "from pathlib import Path; s=Path('campaign-output.log').read_text().splitlines(); i=[n for n,l in enumerate(s) if l.startswith('not ok') or l.startswith('Error:')]; t='\n'.join('\n'.join(s[n:n+18]) for n in i) if i else '\n'.join(s[-30:]); print('::error title=Campaign emulator output::'+t[:3800].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
            exit 1
          fi
  game-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run game tests
        run: node --test IronPath/tests/*.test.mjs
      - name: Install server dependencies
        run: npm ci --prefix IronPath/server --no-audit --no-fund
      - name: Run server tests
        run: npm test --prefix IronPath/server
  interface-browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test tooling
        run: |
          if { npm install --prefix "$RUNNER_TEMP/ironpath-browser" --no-audit --no-fund playwright@1.56.1 && "$RUNNER_TEMP/ironpath-browser/node_modules/.bin/playwright" install --with-deps chromium; } > /tmp/browser-install.log 2>&1; then
            cat /tmp/browser-install.log
          else
            cat /tmp/browser-install.log
            python3 -c "from pathlib import Path; s=Path('/tmp/browser-install.log').read_text()[-3500:]; print('::error title=Browser install::'+s.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
            exit 1
          fi
      - name: Check static interface at phone and desktop sizes
        env:
          NODE_PATH: ${{ runner.temp }}/ironpath-browser/node_modules
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/ironpath-http.log 2>&1 &
          if { node IronPath/browser-tests/interface-smoke.cjs && node IronPath/browser-tests/command-center.cjs; } > /tmp/browser-smoke.log 2>&1; then
            cat /tmp/browser-smoke.log
          else
            cat /tmp/browser-smoke.log
            python3 -c "from pathlib import Path; s=Path('/tmp/browser-smoke.log').read_text()[-3500:]; print('::error title=Browser smoke::'+s.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
            exit 1
          fi
      - name: Save interface screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ironpath-interface-screenshots
          path: browser-artifacts/
          if-no-files-found: ignore
          retention-days: 7
