          else
            cat doctrine-output.log
            python3 -c "from pathlib import Path; s=Path('doctrine-output.log').read_text()[-3500:]; print('::error title=Doctrine emulator output::'+s.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
            exit 1
          fi
      - name: Run complete story rules tests
        shell: bash
        run: |
          if npm run test:story > story-output.log 2>&1; then
            cat story-output.log
          else
            cat story-output.log
            python3 -c "from pathlib import Path; s=Path('story-output.log').read_text().splitlines(); i=[n for n,l in enumerate(s) if l.startswith('not ok') or l.startswith('Error:')]; t='\n'.join('\n'.join(s[n:n+18]) for n in i) if i else '\n'.join(s[-30:]); print('::error title=Story rules output::'+t[:3800].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
            exit 1
          fi
      - name: Run campaign account rules tests
        shell: bash
        run: |
          if npm run test:campaign > campaign-output.log 2>&1; then
            cat campaign-output.log
          else
            cat campaign-output.log
            python3 -c "from pathlib import Path; s=Path('campaign-output.log').read_text().splitlines(); i=[n for n,l in enumerate(s) if l.startswith('not ok') or l.startswith('Error:')]; t='\n'.join('\n'.join(s[n:n+18]) for n in i) if i else '\n'.join(s[-30:]); print('::error title=Campaign emulator output::'+t[:3800].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
            exit 1
          fi
      - name: Run publish-file rules tests (the file that ships to production)
        shell: bash
        run: |
          if npm run test:publish > publish-rules-output.log 2>&1; then
            cat publish-rules-output.log
          else
            cat publish-rules-output.log
            python3 -c "from pathlib import Path; s=Path('publish-rules-output.log').read_text().splitlines(); i=[n for n,l in enumerate(s) if l.startswith('not ok') or l.startswith('Error:')]; t='\n'.join('\n'.join(s[n:n+18]) for n in i) if i else '\n'.join(s[-30:]); print('::error title=Publish-file rules output::'+t[:3800].replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
            exit 1
          fi
      - name: Test Firebase-only maintenance Rules (emulator only; not a deployment)
        run: npm run test:maintenance
      - name: Test experimental release guard (emulator only; not a deployment)
        run: npm run test:release-guard
  game-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Offline Pages packaging verifies both pinned ancestor revisions.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run game tests
        run: node --test IronPath/tests/*.test.mjs
      - name: Run deterministic local stress workloads
        run: node IronPath/stress-tests/run.mjs
      - name: Install server dependencies
        run: npm ci --prefix IronPath/server --no-audit --no-fund
      - name: Run server tests
        run: npm test --prefix IronPath/server
      - name: Install experimental release service dependencies
        run: npm ci --prefix IronPath/release-tools --no-audit --no-fund
      - name: Test unconfigured release service and Node compatibility
        run: node --test IronPath/release-tools/session-config.test.mjs IronPath/release-tools/runtime-compatibility.test.mjs
  interface-browser-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test tooling
        run: |
          # This step has hung three times, always on `--with-deps`: it calls apt,
          # and when the Azure package mirror is slow the job burns its whole 10
          # minutes and reports "exceeded the maximum execution time" with no
          # annotation. Two changes:
          #
          #   1. install Chromium WITHOUT the system packages first. The runner
          #      image already carries the libraries a headless Chromium needs, so
          #      the apt trip is usually unnecessary;
          #   2. only if Chromium will not launch, fetch the packages - with a cap,
          #      so the failure names the mirror instead of the job limit.
          PLAYWRIGHT="$RUNNER_TEMP/ironpath-browser/node_modules/.bin/playwright"
          if ! { timeout 300 npm install --prefix "$RUNNER_TEMP/ironpath-browser" --no-audit --no-fund playwright@1.56.1 && timeout 240 "$PLAYWRIGHT" install chromium; } > /tmp/browser-install.log 2>&1; then
            cat /tmp/browser-install.log
            python3 -c "from pathlib import Path; s=Path('/tmp/browser-install.log').read_text()[-3500:]; print('::error title=Browser install::'+s.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
            exit 1
          fi
          # A launch probe decides whether apt is needed at all, instead of guessing.
          # Resolve the module by path, not by name: NODE_PATH is only exported for
          # the following step, so a bare require() here always failed and sent every
          # run into the apt branch even when nothing was missing.
          if timeout 60 node -e 'require(process.env.RUNNER_TEMP+"/ironpath-browser/node_modules/playwright").chromium.launch({headless:true}).then(b=>b.close()).catch(e=>{console.error(e.message);process.exit(1)})' > /tmp/browser-probe.log 2>&1; then
            cat /tmp/browser-install.log; echo 'chromium launches without system packages'
          else
            cat /tmp/browser-probe.log
            echo '::warning title=Browser deps::chromium needs system packages, fetching them the slow way'
            if timeout 420 "$PLAYWRIGHT" install-deps chromium > /tmp/browser-deps.log 2>&1; then
              cat /tmp/browser-deps.log
            else
              cat /tmp/browser-deps.log
              python3 -c "from pathlib import Path; s=Path('/tmp/browser-deps.log').read_text()[-3500:]; print('::error title=Browser system packages::'+s.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
              exit 1
            fi
          fi
      - name: Check static interface at phone and desktop sizes
        env:
          NODE_PATH: ${{ runner.temp }}/ironpath-browser/node_modules
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/ironpath-http.log 2>&1 &
          if { timeout 180 node IronPath/browser-tests/interface-smoke.cjs && timeout 300 node IronPath/browser-tests/command-center.cjs && timeout 180 node IronPath/browser-tests/retreat-viewport.cjs && timeout 180 node IronPath/browser-tests/multiplayer-field.cjs && timeout 300 node IronPath/browser-tests/multiplayer-fullscreen.cjs && timeout 180 node IronPath/browser-tests/multiplayer-account-handoff.cjs && timeout 180 node IronPath/browser-tests/maintenance-preview.cjs && timeout 180 node IronPath/browser-tests/release-stage.cjs && timeout 180 node IronPath/browser-tests/release-gates.cjs; } > /tmp/browser-smoke.log 2>&1; then
            cat /tmp/browser-smoke.log
          else
            cat /tmp/browser-smoke.log
            python3 -c "from pathlib import Path; s=Path('/tmp/browser-smoke.log').read_text()[-3500:]; print('::error title=Browser smoke::'+s.replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Firebase emulator test tooling
        run: npm ci --prefix IronPath/firebase/rules-test --no-audit --no-fund
      - name: Test release auth, launcher and staged game in Chromium (emulators only)
        working-directory: IronPath/firebase/rules-test
        env:
          NODE_PATH: ${{ runner.temp }}/ironpath-browser/node_modules
        run: npm run test:release-tabs
      - name: Test social and character cleanup UI in Chromium (emulators only)
        working-directory: IronPath/firebase/rules-test
        env:
          NODE_PATH: ${{ runner.temp }}/ironpath-browser/node_modules
        run: npm run test:social-browser
      - name: Save interface screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ironpath-interface-screenshots
          path: browser-artifacts/
          if-no-files-found: ignore
          retention-days: 7
