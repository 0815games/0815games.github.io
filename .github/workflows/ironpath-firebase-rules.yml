name: Iron Path Firebase party rules
on:
  push:
    paths: ['IronPath/firebase/**', 'IronPath/firebase-party-*.mjs', '.github/workflows/ironpath-firebase-rules.yml']
  pull_request:
    paths: ['IronPath/firebase/**', 'IronPath/firebase-party-*.mjs', '.github/workflows/ironpath-firebase-rules.yml']
permissions:
  contents: read
jobs:
  database-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: IronPath/firebase/rules-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: IronPath/firebase/rules-test/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --no-audit --no-fund
      - run: npm test
