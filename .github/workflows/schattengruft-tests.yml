name: Schattengruft tests

# Läuft, sobald sich das Spiel selbst, seine Tests oder dieser Workflow ändern.
# Der Verkabelungs-Test (html-assets.mjs) hat Vorrang: Er erkennt einen
# Totalausfall wie am 2026-10-29, wenn index.html auf den falschen Ordner zeigt.
on:
  push:
    branches: [main]
    paths:
      - 'schattengruft/**'
      - 'package.json'
      - '.github/workflows/schattengruft-tests.yml'
  pull_request:
    paths:
      - 'schattengruft/**'
      - 'package.json'
      - '.github/workflows/schattengruft-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schattengruft-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verkabelung von index.html prüfen
        run: node --test schattengruft/tests/html-assets.mjs

      - name: Alle Schattengruft-Suiten
        run: node --test schattengruft/tests/*.mjs
