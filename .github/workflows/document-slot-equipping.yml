name: Document incremental armory slot changes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/document-slot-equipping.yml']
permissions:
  contents: write
jobs:
  document:
    if: github.repository == 'pipboy3003/pipboy3003.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Preserve history and prepend documentation
        shell: python
        run: |
          from pathlib import Path
          entries = {
              'rpg/change.log': ('# CHANGELOG – Chroniken der Schattengruft\n\n', '''## 2026-10-19 – Ingame-Rüstkammer: Slotliste und Ausrüsten in kleinen Schritten
          - `0f323c0`: neuer equipment-candidates.js-Filter und tests/equipment-candidates.mjs. Nur vorhandene Gegenstände mit passendem Ausrüstungsplatz und gültigem positivem Bestand anbieten; Inventar unverändert lassen.
          - `962942b`: leere Slots öffnen eine Liste passender Inventargegenstände. Leerzustand, Schließen und Fokus-Rückgabe ergänzt; allein dieser Schritt führte noch keine Ausrüstungsaktion aus.
          - `5d19474`: Ausrüsten-Buttons in der Liste verwenden den vorhandenen inventoryEquipAction-Callback der zugehörigen Inventarzeile. Nach bestätigtem angelegtem Gegenstand Liste schließen; Vorschau und Werte über den bestehenden HUD-/Ausrüstungspfad aktualisieren. Keine neue eigenständige Inventar- oder Speicheroperation.
          - Vor Ausrüsten Spieler, Konto/Auth-UID, Speicherplatz, Welt/Kartenidentität, Inventar-/Ausrüstungsreferenzen, Gegenstand/Bestand und leeren Zielplatz prüfen. Kampf, Tod, Vorbereitung, Hintergrund und blockierende Dialoge sperren die Aktion; veraltete Auswahl und Wiederholung abweisen.
          - Prüfstände getrennt: 14 lokale Filterprüfungen mit Item-/Inventar-Fixtures, 10 lokale Öffnungsprüfungen mit DOM-/Spieler-Doubles und 15 lokale Adapterprüfungen mit Zustands-/Auth-/DOM-/Aktions-Doubles bestanden. Keine gemeinsame End-to-End-Suite; Öffnungs-/Adaptertests noch nicht als Repository-Testdateien veröffentlicht. Vollständige Regressionen nach diesen drei direkten Commits, Deployment sowie Browser-/Geräte-/Speicherabnahme offen.
          - Direkte kleine Codecommits ohne Patch-Workflow. Dieser Nachtrag ist nur Dokumentation. T10/T14 nicht pauschal abgeschlossen; Spielversion bleibt v0.5.26.
          '''),
              'rpg/to-do.md': ('# To-do – Chroniken der Schattengruft\n\n', '''## Aktueller T10-Ingame-Stand – Slot-Auswahl, 2026-10-19
          Dieser Nachtrag ersetzt ältere Angaben zur Slot-Auswahl als noch nicht implementiertem nächsten Schritt; die Historie bleibt erhalten.
          - [ ] Implementiert – Abnahme offen: passender Inventarfilter `0f323c0`, Öffnen/Schließen der Liste `962942b`, Ausrüsten über vorhandene Inventar-Aktion `5d19474`. Nur leere Slots; Ausrüstungstausch über belegte Slots nicht zusätzlich umgesetzt.
          - [ ] Öffnungs-/Adaptertests als wiederholbare Repository-Suites ergänzen und vollständige Regressionen ausführen. Lokale Prüfstände: Filter 14, Öffnung 10, Adapter 15; Test-Doubles, keine echte Gesamtintegration.
          - [ ] Deploy und mobile/Desktop-Abnahme: leeren Slot öffnen, nur passende Gegenstände, Leerzustand, Schließen, einmaliges Ausrüsten, korrekter Bestand sowie aktualisierte Figur/Werte. Ablegen und erneutes Ausrüsten, Tastaturfokus und Speichern/Neuladen prüfen.
          - [ ] Veraltete Auswahl, Doppelklick, Kampf-/Dialog-/Sitzungssperren und Konto-/Slotwechsel real mitprüfen. Kein vollständiger T10-/T14-Abschluss ohne Abnahme; Vorbereitungs-Shop und T11-Angebotsvergleich bleiben getrennt.
          ''')
          }
          prepared = []
          for path, (header, entry) in entries.items():
              p = Path(path)
              original = p.read_bytes()
              prefix = header.encode('utf-8')
              addition = ('\n'.join(line.strip() for line in entry.strip().splitlines()) + '\n\n').encode('utf-8')
              assert original.startswith(prefix), ('Unexpected heading', path)
              assert addition.splitlines()[0] not in original, ('Already documented', path)
              result = prefix + addition + original[len(prefix):]
              assert result[len(prefix) + len(addition):] == original[len(prefix):]
              prepared.append((p, result))
          for p, result in prepared:
              p.write_bytes(result)
          Path('.github/workflows/document-slot-equipping.yml').unlink()
      - name: Commit documentation only
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rpg/change.log rpg/to-do.md .github/workflows/document-slot-equipping.yml
          git commit -m 'docs: record incremental armory slot selection and equipping'
          git push origin HEAD:main
