name: Apply approved keyboard-controls patch
on:
  push:
    branches: [main]
    paths: [.github/workflows/apply-keyboard-controls.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: approved-keyboard-controls-patch
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'pipboy3003/pipboy3003.github.io'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply hash-guarded patch, test, and push
        shell: python
        run: |
          import base64, gzip, hashlib
          data = gzip.decompress(base64.b64decode(''))
          assert hashlib.sha256(data).hexdigest() == '395f80ce4ffe197851e5f442ac915efeda5a2a0ec84e0e82dcc4eec5d9399a65'
          exec(compile(data, 'approved-keyboard-controls-patch.py', 'exec'))
