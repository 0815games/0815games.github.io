<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>INKFALL — Prototyp v0.4</title>
<style>
body{margin:0;background:#1c1a17;color:#f4ead8;font-family:Georgia,serif;display:flex;min-height:100vh}
#game{flex:1;display:flex;align-items:center;justify-content:center;padding:10px}
canvas{background:#f4ead8;border:4px solid #22201c;border-radius:6px;max-width:100%}
#ui{width:330px;padding:16px;background:#26221d;border-left:4px solid #22201c}
h1{margin:0 0 4px;font-size:22px}
h2{font-size:14px;margin:16px 0 6px;color:#b8860b}
.stat{display:flex;justify-content:space-between;font-size:14px;margin:4px 0}
button{width:100%;margin:4px 0;padding:8px;border:2px solid #22201c;background:#f4ead8;color:#22201c;font-family:inherit;font-weight:bold;cursor:pointer;border-radius:4px}
button:disabled{opacity:.4;cursor:not-allowed}
#log{height:130px;overflow:auto;font-size:12px;background:#171512;border:1px solid #4a423a;padding:8px;margin-top:8px}
#tree{position:fixed;inset:0;background:rgba(20,18,15,.96);display:none;overflow:auto;padding:24px}
#tree.open{display:block}
.region{border:2px solid #555;border-radius:8px;padding:12px;margin-bottom:14px;background:#211d18}
.node{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px;border:1px dashed #777;border-radius:5px;margin:5px 0;font-size:13px}
.node.owned{border-style:solid;border-color:#b8860b;background:#2c261d}
.node.locked{opacity:.45}
.node button{width:auto;margin:0;padding:4px 8px;font-size:12px}
.close{position:fixed;top:14px;right:18px;width:auto;padding:8px 14px}
</style>
</head>
<body>
<div id="game"><canvas id="cv" width="940" height="600"></canvas></div>
<div id="ui">
<h1>INKFALL</h1>
<div style="font-size:12px;opacity:.8">Prototyp v0.4 — Held & Fähigkeit</div>
<h2>Bastion</h2>
<div class="stat"><span>Leben</span><span id="lives">100</span></div>
<div class="stat"><span>Gold</span><span id="gold">150</span></div>
<div class="stat"><span>Welle</span><span id="wave">0 / 10</span></div>
<div class="stat"><span>Skillpunkte</span><span id="sp">0</span></div>
<h2>Held</h2>
<div class="stat"><span>Klasse</span><span id="className">Ritter</span></div>
<div class="stat"><span>Fähigkeit</span><span id="ability">Bereit</span></div>
<button onclick="setHero('knight')">Ritter werden</button>
<button onclick="setHero('mage')">Elementarmagier werden</button>
<button id="abilityBtn" onclick="useAbility()">Fähigkeit einsetzen</button>
<h2>Türme</h2>
<button onclick="build('arrow')">Pfeilturm — 100 G</button>
<button onclick="build('frost')">Frostturm — 140 G</button>
<button onclick="build('cannon')">Kanone — 180 G</button>
<button onclick="build('antiair')">Luftabwehr — 160 G</button>
<h2>Aktionen</h2>
<button id="start" onclick="startWave()">Welle starten</button>
<button onclick="openTree()">Skilltree öffnen</button>
<button onclick="speed=speed===1?2:1;this.textContent='Speed: '+speed+'x'">Speed: 1x</button>
<button id="up" onclick="upgrade()" disabled>Turm verbessern</button>
<button onclick="location.reload()">Neustart</button>
<h2>Protokoll</h2>
<div id="log"></div>
</div>

<div id="tree">
<button class="close" onclick="closeTree()">Schließen</button>
<h1 style="color:#b8860b">Tinten-Constellarium</h1>
<div id="treeContent"></div>
</div>

<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const ground=[[40,70],[280,70],[280,240],[600,240],[600,430],[850,430],[850,540]];
const air=[[40,30],[300,30],[300,150],[640,150],[640,330],[880,330],[880,540]];
const base={x:850,y:540,r:24};
let gold=150,lives=100,wave=0,active=false,enemies=[],towers=[],shots=[],queue=[],timer=0,speed=1,sel=null,buildType=null,skillPoints=0,skills={};
let hero={x:120,y:300,target:null,cls:'knight',cd:0,attackCd:0};
const HERO={
knight:{name:'Ritter',color:'#a33',range:70,dmg:16,rate:.8,ability:'Schildstoß',cd:10},
mage:{name:'Elementarmagier',color:'#3a6ea5',range:95,dmg:12,rate:.9,ability:'Frostnova',cd:12}
};
const T={
arrow:{n:'Pfeilturm',c:100,r:110,rate:.55,d:14,col:'#8a5a2b',air:false},
frost:{n:'Frostturm',c:140,r:95,rate:.9,d:5,col:'#3a6ea5',slow:.35,air:false},
cannon:{n:'Kanone',c:180,r:85,rate:1.4,d:34,col:'#6b6b6b',aoe:46,air:false},
antiair:{n:'Luftabwehr',c:160,r:130,rate:.5,d:18,col:'#7a5aa0',air:true}
};
const E={
crawler:{n:'Kriecher',hp:60,s:.9,g:12,r:11,col:'#7a4a2a',dmg:5,route:'ground'},
runner:{n:'Renner',hp:27,s:1.7,g:10,r:9,col:'#a33',dmg:5,route:'ground'},
tank:{n:'Panzerriese',hp:250,s:.55,g:26,r:16,col:'#4a4a4a',dmg:10,armor:.2,route:'ground'},
shield:{n:'Schildling',hp:95,s:.8,g:16,r:13,col:'#5a6b7a',dmg:5,shield:.5,route:'ground'},
flyer:{n:'Flieger',hp:42,s:1.35,g:14,r:10,col:'#6a4a8a',dmg:5,route:'air'},
healer:{n:'Heiler',hp:72,s:.8,g:22,r:11,col:'#3f7d4f',dmg:5,healer:true,route:'ground'},
boss:{n:'Tintenkoloss',hp:2500,s:.5,g:250,r:24,col:'#222',dmg:25,armor:.2,boss:true,route:'ground'}
};
const waves=[
[['crawler',5]],[['crawler',6]],[['crawler',6],['runner',3]],[['crawler',7],['runner',3]],
[['crawler',7],['runner',4],['tank',1]],[['crawler',8],['runner',4],['shield',2]],
[['crawler',8],['runner',5],['tank',1]],[['crawler',9],['runner',5],['shield',2],['flyer',3]],
[['crawler',9],['runner',6],['tank',2],['healer',1]],
[['boss',1],['crawler',10],['runner',6],['tank',2],['shield',3],['flyer',4]]
];
const TREE=[
{id:'blade1',region:'Klinge',name:'Scharfer Stahl',desc:'+10 % Helden- und Turm-Schaden',tier:1,cost:1},
{id:'blade2',region:'Klinge',name:'Wuchtige Hiebe',desc:'+15 % Schaden gegen Panzer',tier:2,cost:1,req:'blade1'},
{id:'blade3',region:'Klinge',name:'Rüstungsbrecher',desc:'Panzer wird um 10 % reduziert',tier:3,cost:2,req:'blade2'},
{id:'blade4',region:'Klinge',name:'Klingensturm',desc:'+20 % Turm-Schaden',tier:4,cost:2,req:'blade3'},
{id:'arcane1',region:'Arkan',name:'Arkane Funken',desc:'+10 % Helden- und Frost-Schaden',tier:1,cost:1},
{id:'arcane2',region:'Arkan',name:'Tiefer Frost',desc:'Frost verlangsamt zusätzlich 10 %',tier:2,cost:1,req:'arcane1'},
{id:'arcane3',region:'Arkan',name:'Kettenblitz',desc:'Kanonen-Schaden +15 %',tier:3,cost:2,req:'arcane2'},
{id:'arcane4',region:'Arkan',name:'Sturmfront',desc:'+20 % Frost-Schaden',tier:4,cost:2,req:'arcane3'},
{id:'bastion1',region:'Bastion',name:'Stabile Mauern',desc:'+10 % Turm-Reichweite',tier:1,cost:1},
{id:'bastion2',region:'Bastion',name:'Reparatur',desc:'Türme kosten 5 % weniger',tier:2,cost:1,req:'bastion1'},
{id:'bastion3',region:'Bastion',name:'Turm-Wachstum',desc:'+10 % Turm-Schaden',tier:3,cost:2,req:'bastion2'},
{id:'bastion4',region:'Bastion',name:'Letzte Bastion',desc:'+15 % Turm-Reichweite',tier:4,cost:2,req:'bastion3'},
{id:'shadow1',region:'Schatten',name:'Flinke Schritte',desc:'+15 % Heldentempo',tier:1,cost:1},
{id:'shadow2',region:'Schatten',name:'Präzision',desc:'+10 % Schaden gegen Flieger',tier:2,cost:1,req:'shadow1'},
{id:'shadow3',region:'Schatten',name:'Giftklinge',desc:'+15 % Heldenschaden',tier:3,cost:2,req:'shadow2'},
{id:'shadow4',region:'Schatten',name:'Todesmarke',desc:'+25 % Schaden gegen Bosse',tier:4,cost:2,req:'shadow3'},
{id:'wealth1',region:'Reichtum',name:'Goldader',desc:'+10 % Gold aus Gegnern',tier:1,cost:1},
{id:'wealth2',region:'Reichtum',name:'Günstiger Bau',desc:'Türme kosten 5 % weniger',tier:2,cost:1,req:'wealth1'},
{id:'wealth3',region:'Reichtum',name:'Tintenzins',desc:'+10 Gold pro Welle',tier:3,cost:2,req:'wealth2'},
{id:'wealth4',region:'Reichtum',name:'Schatzkammer',desc:'+15 % Gold aus Gegnern',tier:4,cost:2,req:'wealth3'},
{id:'band1',region:'Band',name:'Gemeinsame Wache',desc:'+5 % Turm-Schaden',tier:1,cost:1},
{id:'band2',region:'Band',name:'Schild-Übertragung',desc:'+5 % Turm-Reichweite',tier:2,cost:1,req:'band1'},
{id:'band3',region:'Band',name:'Element-Brücke',desc:'+10 % Frost-Schaden',tier:3,cost:2,req:'band2'},
{id:'band4',region:'Band',name:'Vereinte Ultimative',desc:'+10 % Schaden gegen Bosse',tier:4,cost:2,req:'band3'}
];
function log(t){document.getElementById('log').innerHTML='<div>'+t+'</div>'+document.getElementById('log').innerHTML}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function makePath(pts){let total=0,segs=[];for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],l=Math.hypot(b[0]-a[0],b[1]-a[1]);segs.push({a,b,l,s:total});total+=l}return{segs,total}}
const GP=makePath(ground),AP=makePath(air);
function pos(e){const P=e.route==='air'?AP:GP;let d=e.d;if(d>P.total)d=P.total;for(const s of P.segs){if(d<=s.s+s.l){const t=(d-s.s)/s.l;return{x:s.a[0]+(s.b[0]-s.a[0])*t,y:s.a[1]+(s.b[1]-s.a[1])*t}}}return{x:GP.segs.at(-1).b[0],y:GP.segs.at(-1).b[1]}}
function hpS(w){return Math.pow(1.175,w-1)}
function has(id){return !!skills[id]}
function heroDmg(e){let d=HERO[hero.cls].dmg;
if(has('blade1'))d*=1.10;if(has('arcane1'))d*=1.10;if(has('shadow3'))d*=1.15;
if(e){if(e.t==='tank'&&has('blade2'))d*=1.15;if(e.t==='flyer'&&has('shadow2'))d*=1.10;if(e.t==='boss'){if(has('shadow4'))d*=1.25;if(has('band4'))d*=1.10}}
return d}
function towerDamage(type,e){let d=T[type].d;
if(has('blade1'))d*=1.08;if(has('bastion3'))d*=1.10;if(has('band1'))d*=1.05;
if(type==='frost'){if(has('arcane4'))d*=1.20;if(has('band3'))d*=1.10}
if(type==='cannon'&&has('arcane3'))d*=1.15;
if(e){if(e.t==='tank'&&has('blade2'))d*=1.15;if(e.t==='flyer'&&has('shadow2'))d*=1.10;if(e.t==='boss'){if(has('shadow4'))d*=1.25;if(has('band4'))d*=1.10}}
return d}
function towerRange(type){let r=T[type].r;if(has('bastion1'))r*=1.10;if(has('bastion4'))r*=1.15;if(has('band2'))r*=1.05;return r}
function goldMult(){let m=1;if(has('wealth1'))m*=1.10;if(has('wealth4'))m*=1.15;return m}
function buildCost(type){let c=T[type].c;if(has('bastion2'))c*=.95;if(has('wealth2'))c*=.95;return Math.round(c)}
function frostSlow(){let s=.35;if(has('arcane2'))s+=.10;return s}
function setHero(cls){hero.cls=cls;hero.cd=0;log('Du bist jetzt: <b>'+HERO[cls].name+'</b>');ui()}
function useAbility(){if(hero.cd>0)return;
if(hero.cls==='knight'){for(const e of enemies){if(e.route==='ground'&&dist(hero,pos(e))<130){e.slow=Math.max(e.slow,.6);hit(e,25,'hero')}}log('<b>Schildstoß!</b> Gegner im Umkreis verlangsamt.')}
else{for(const e of enemies){if(dist(hero,pos(e))<150){e.slow=Math.max(e.slow,frostSlow()+.2);hit(e,35,'hero')}}log('<b>Frostnova!</b> Gegner im Umkreis getroffen.')}
hero.cd=HERO[hero.cls].cd;ui()}
function startWave(){if(active||wave>=waves.length)return;wave++;active=true;enemies=[];shots=[];queue=[];timer=0;let d=0;
if(has('wealth3'))gold+=10;
waves[wave-1].forEach(([t,n])=>{for(let i=0;i<n;i++){queue.push({t,d});d+=t==='runner'?.55:t==='flyer'?.7:.85}});
if(wave===10)queue.unshift({t:'boss',d:10});
log('<b>Welle '+wave+'</b> gestartet.');ui()}
function build(t){if(active){log('Während der Welle nicht bauen.');return}const c=buildCost(t);if(gold<c){log('Nicht genug Gold.');return}buildType=t;log(T[t].n+': Karte anklicken.')}
cv.onclick=e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*(cv.width/r.width),y=(e.clientY-r.top)*(cv.height/r.height);
if(buildType){const c=buildCost(buildType);if(gold<c)return;if(near(x,y,26,ground)){log('Zu nah am Bodenweg.');return}gold-=c;towers.push({t:buildType,x,y,lvl:1,cd:0});log(T[buildType].n+' gebaut.');buildType=null;ui();return}
hero.target={x,y};};
function near(x,y,r,pts){for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],dx=b[0]-a[0],dy=b[1]-a[1],l2=dx*dx+dy*dy;let t=((x-a[0])*dx+(y-a[1])*dy)/l2;t=Math.max(0,Math.min(1,t));if(Math.hypot(x-(a[0]+dx*t),y-(a[1]+dy*t))<r)return true}return false}
function upgrade(){if(!sel)return;const c=Math.round(T[sel.t].c*.7*sel.lvl);if(gold<c){log('Upgrade kostet '+c+' Gold.');return}gold-=c;sel.lvl++;log(T[sel.t].n+' → Stufe '+sel.lvl);ui()}
function spawn(t){const e=E[t];const hp=t==='boss'?2500:e.hp*hpS(wave);enemies.push({t,d:0,hp,max:hp,slow:0,shieldUp:t==='boss',healCd:0})}
function hit(e,dmg,type){if(e.t==='boss'&&e.shieldUp&&type==='arrow')return;
let m=1;if(e.t==='tank'){m-=E.tank.armor;if(has('blade3'))m+=.10}
if(e.t==='shield'&&type==='arrow')m-=E.shield.shield;
if(e.t==='boss')m-=E.boss.armor;
e.hp-=dmg*Math.max(.2,m);
if(e.hp<=0){const g=Math.round(E[e.t].g*goldMult());gold+=g;log(E[e.t].n+' besiegt: +'+g+' Gold.');
if(e.t==='boss')log('<b>Tintenkoloss besiegt!</b>')}}
function update(dt){if(active){timer+=dt;while(queue.length&&queue[0].d<=timer){spawn(queue.shift().t)}
if(hero.target){const dx=hero.target.x-hero.x,dy=hero.target.y-hero.y,dd=Math.hypot(dx,dy);if(dd>4){const sp=(has('shadow1')?165:150)*dt;hero.x+=dx/dd*sp;hero.y+=dy/dd*sp}}
hero.cd=Math.max(0,hero.cd-dt);hero.attackCd-=dt;
if(hero.attackCd<=0){let best=null,bd=1e9;for(const e of enemies){const p=pos(e.d),dd=dist(hero,p);if(dd<HERO[hero.cls].range&&dd<bd){bd=dd;best=e}}
if(best){hero.attackCd=HERO[hero.cls].rate;hit(best,heroDmg(best),'hero')}}
for(const e of enemies){let sp=E[e.t].s*(1-e.slow);if(e.t==='boss'&&e.hp/e.max<.3){sp*=1.3;if(!e.enraged){e.enraged=true;log('Tintenkoloss ist wütend!')}}
e.d+=sp*dt;e.slow=Math.max(0,e.slow-dt*.25);
if(E[e.t].healer){e.healCd-=dt;if(e.healCd<=0){e.healCd=2;for(const o of enemies){if(o!==e&&o.route==='ground'&&dist(pos(o),pos(e))<85&&o.hp<o.max)o.hp=Math.min(o.max,o.hp+18)}}}
if(e.d>=(e.route==='air'?AP.total:GP.total)){e.alive=false;lives-=E[e.t].dmg;log(E[e.t].n+' erreichte die Bastion!')}}
enemies=enemies.filter(e=>e.hp>0&&e.alive!==false);
for(const t of towers){t.cd-=dt;if(t.cd>0)continue;const d=T[t.t],range=towerRange(t.t);let best=null,bd=-1;
for(const e of enemies){if(d.air&&e.route!=='air')continue;if(!d.air&&e.route==='air')continue;const p=pos(e.d);if(dist(t,p)<=range&&e.d>bd){bd=e.d;best=e}}
if(best){t.cd=d.rate;const p=pos(best.d);shots.push({x:t.x,y:t.y,e:best,dmg:towerDamage(t.t,best),type:t.t,aoe:d.aoe,slow:frostSlow()})}}
for(const s of shots){const p=pos(s.e.d),dx=p.x-s.x,dy=p.y-s.y,dd=Math.hypot(dx,dy);if(dd<12){s.dead=true;
if(s.aoe){for(const e of enemies){if(e.route===s.e.route&&dist(pos(e),p)<=s.aoe)hit(e,s.dmg,s.type)}}else hit(s.e,s.dmg,s.type);
if(s.slow)s.e.slow=Math.max(s.e.slow,s.slow)}else{s.x+=dx/dd*420*dt;s.y+=dy/dd*420*dt}}
shots=shots.filter(s=>!s.dead);
if(!queue.length&&!enemies.length){active=false;skillPoints++;log('<b>Welle '+wave+' geschafft!</b> +1 Skillpunkt');if(wave>=waves.length)log('<b>Alle 10 Wellen geschafft!</b>')}}
if(lives<=0){active=false;log('<b>Bastion gefallen.</b>')}
ui()}
function ui(){document.getElementById('lives').textContent=Math.max(0,lives);document.getElementById('gold').textContent=gold;document.getElementById('wave').textContent=wave+' / '+waves.length;document.getElementById('sp').textContent=skillPoints;document.getElementById('className').textContent=HERO[hero.cls].name;document.getElementById('ability').textContent=hero.cd>0?Math.ceil(hero.cd)+' s':'Bereit';document.getElementById('abilityBtn').textContent=HERO[hero.cls].ability+' ('+Math.ceil(hero.cd)+' s)';document.getElementById('abilityBtn').disabled=hero.cd>0;document.getElementById('start').disabled=active||wave>=waves.length;document.getElementById('up').disabled=!sel;document.getElementById('up').textContent=sel?('Verbessern — '+Math.round(T[sel.t].c*.7*sel.lvl)+' G'):'Turm verbessern'}
function openTree(){document.getElementById('tree').classList.add('open');renderTree()}
function closeTree(){document.getElementById('tree').classList.remove('open')}
function renderTree(){const c=document.getElementById('treeContent');let html='';const regions=[...new Set(TREE.map(n=>n.region))];
for(const r of regions){html+='<div class="region"><h3>'+r+'</h3>';
for(const n of TREE.filter(n=>n.region===r)){const owned=has(n.id),locked=n.req&&!has(n.req),can=skillPoints>=n.cost&&!owned&&!locked;
html+='<div class="node '+(owned?'owned':locked?'locked':'')+'"><div><b>'+n.name+'</b><br><span style="opacity:.8">'+n.desc+'</span></div>';
html+=owned?'<span style="color:#b8860b">Aktiv</span>':'<button '+(can?'':'disabled')+' onclick="buy(\''+n.id+'\')">'+n.cost+' SP</button></div>'}
html+='</div>'}c.innerHTML=html}
function buy(id){const n=TREE.find(x=>x.id===id);if(!n||has(id))return;if(n.req&&!has(n.req))return;if(skillPoints<n.cost)return;skillPoints-=n.cost;skills[id]=true;log('Skill freigeschaltet: <b>'+n.name+'</b>');renderTree();ui()}
function drawPath(pts,col){ctx.strokeStyle=col;ctx.lineWidth=30;ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(...pts[0]);pts.slice(1).forEach(p=>ctx.lineTo(...p));ctx.stroke();ctx.strokeStyle='#8b7355';ctx.lineWidth=3;ctx.setLineDash([9,7]);ctx.stroke();ctx.setLineDash([])}
function draw(){ctx.clearRect(0,0,cv.width,cv.height);ctx.fillStyle='#e8d9bd';ctx.fillRect(0,0,cv.width,cv.height);
drawPath(ground,'#c9b58f');drawPath(air,'#b9c6d6');
ctx.fillStyle='#4f7d4f';ctx.beginPath();ctx.arc(base.x,base.y,base.r,0,7);ctx.fill();ctx.fillStyle='#f4ead8';ctx.font='bold 12px Georgia';ctx.textAlign='center';ctx.fillText('BASTION',base.x,base.y+4);
for(const t of towers){const d=T[t.t];ctx.fillStyle=d.col;ctx.beginPath();ctx.arc(t.x,t.y,15,0,7);ctx.fill();ctx.strokeStyle='#22201c';ctx.lineWidth=3;ctx.stroke();if(sel===t){ctx.strokeStyle='#b8860b';ctx.beginPath();ctx.arc(t.x,t.y,towerRange(t.t),0,7);ctx.stroke()}ctx.fillStyle='#f4ead8';ctx.fillText('L'+t.lvl,t.x,t.y+4)}
for(const e of enemies){const p=pos(e.d);ctx.fillStyle=E[e.t].col;ctx.beginPath();ctx.arc(p.x,p.y,E[e.t].r,0,7);ctx.fill();ctx.strokeStyle='#22201c';ctx.lineWidth=2;ctx.stroke();
if(e.t==='boss'&&e.shieldUp){ctx.strokeStyle='#3a6ea5';ctx.lineWidth=4;ctx.beginPath();ctx.arc(p.x,p.y,E[e.t].r+7,0,7);ctx.stroke()}
ctx.fillStyle='#000';ctx.fillRect(p.x-15,p.y-22,30,4);ctx.fillStyle='#a33';ctx.fillRect(p.x-15,p.y-22,30*Math.max(0,e.hp/e.max),4)}
ctx.fillStyle=HERO[hero.cls].color;ctx.beginPath();ctx.arc(hero.x,hero.y,13,0,7);ctx.fill();ctx.strokeStyle='#22201c';ctx.lineWidth=3;ctx.stroke();
ctx.fillStyle='#f4ead8';ctx.font='bold 10px Georgia';ctx.fillText(HERO[hero.cls].name,hero.x,hero.y-18);
