<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');

// INKFALL_ART_V1
const inkfallArt = {};
for (const [key, path] of Object.entries({
  knight: 'assets/art/heroes/knight.svg',
  mage: 'assets/art/heroes/mage.svg',
  arrow: 'assets/art/towers/arrow.svg'
})) {
  const image = new Image();
  image.src = path;
  image.onerror = () => console.warn('Grafik fehlt:', path);
  inkfallArt[key] = image;
}

function drawInkfallArt(key, x, y, width, height) {
  const image = inkfallArt[key];
  if (!image || !image.complete || !image.naturalWidth) return false;
  ctx.drawImage(image, x, y, width, height);
  return true;
}

const ground=[[40,70],[280,70],[280,240],[600,240],[600,430],[850,430],[850,540]];
const air=[[40,30],[300,30],[300,150],[640,150],[640,330],[880,330],[880,540]];
const base={x:850,y:540,r:24};
let gold=150,lives=100,wave=0,active=false,enemies=[],towers=[],shots=[],queue=[],timer=0,speed=1,sel=null,buildType=null,skillPoints=0,skills={};
let hero={x:120,y:300,target:null,cls:'knight',cd:0,attackCd:0};
const HERO={
knight:{name:'Ritter',color:'#a33',range:70,dmg:16,rate:.8,ability:'Schildstoß',cd:10},
mage:{name:'Elementarmagier',color:'#3a6ea5',range:95,dmg:12,rate:.9,ability:'Frostnova',cd:12}
};
const T={
arrow:{n:'Pfeilturm',c:100,r:110,rate:.55,d:14,col:'#8a5a2b',air:false},
frost:{n:'Frostturm',c:140,r:95,rate:.9,d:5,col:'#3a6ea5',slow:.35,air:false},
cannon:{n:'Kanone',c:180,r:85,rate:1.4,d:34,col:'#6b6b6b',aoe:46,air:false},
antiair:{n:'Luftabwehr',c:160,r:130,rate:.5,d:18,col:'#7a5aa0',air:true}
};
const E={
crawler:{n:'Kriecher',hp:60,s:.9,g:12,r:11,col:'#7a4a2a',dmg:5,route:'ground'},
runner:{n:'Renner',hp:27,s:1.7,g:10,r:9,col:'#a33',dmg:5,route:'ground'},
tank:{n:'Panzerriese',hp:250,s:.55,g:26,r:16,col:'#4a4a4a',dmg:10,armor:.2,route:'ground'},
shield:{n:'Schildling',hp:95,s:.8,g:16,r:13,col:'#5a6b7a',dmg:5,shield:.5,route:'ground'},
flyer:{n:'Flieger',hp:42,s:1.35,g:14,r:10,col:'#6a4a8a',dmg:5,route:'air'},
healer:{n:'Heiler',hp:72,s:.8,g:22,r:11,col:'#3f7d4f',dmg:5,healer:true,route:'ground'},
boss:{n:'Tintenkoloss',hp:2500,s:.5,g:250,r:24,col:'#222',dmg:25,armor:.2,boss:true,route:'ground'}
};
const waves=[
[['crawler',5]],[['crawler',6]],[['crawler',6],['runner',3]],[['crawler',7],['runner',3]],
[['crawler',7],['runner',4],['tank',1]],[['crawler',8],['runner',4],['shield',2]],
[['crawler',8],['runner',5],['tank',1]],[['crawler',9],['runner',5],['shield',2],['flyer',3]],
[['crawler',9],['runner',6],['tank',2],['healer',1]],
[['boss',1],['crawler',10],['runner',6],['tank',2],['shield',3],['flyer',4]]
];
const TREE=[
{id:'blade1',region:'Klinge',name:'Scharfer Stahl',desc:'+10 % Helden- und Turm-Schaden',tier:1,cost:1},
{id:'blade2',region:'Klinge',name:'Wuchtige Hiebe',desc:'+15 % Schaden gegen Panzer',tier:2,cost:1,req:'blade1'},
{id:'blade3',region:'Klinge',name:'Rüstungsbrecher',desc:'Panzer wird um 10 % reduziert',tier:3,cost:2,req:'blade2'},
{id:'blade4',region:'Klinge',name:'Klingensturm',desc:'+20 % Turm-Schaden',tier:4,cost:2,req:'blade3'},
{id:'arcane1',region:'Arkan',name:'Arkane Funken',desc:'+10 % Helden- und Frost-Schaden',tier:1,cost:1},
{id:'arcane2',region:'Arkan',name:'Tiefer Frost',desc:'Frost verlangsamt zusätzlich 10 %',tier:2,cost:1,req:'arcane1'},
{id:'arcane3',region:'Arkan',name:'Kettenblitz',desc:'Kanonen-Schaden +15 %',tier:3,cost:2,req:'arcane2'},
{id:'arcane4',region:'Arkan',name:'Sturmfront',desc:'+20 % Frost-Schaden',tier:4,cost:2,req:'arcane3'},
{id:'bastion1',region:'Bastion',name:'Stabile Mauern',desc:'+10 % Turm-Reichweite',tier:1,cost:1},
{id:'bastion2',region:'Bastion',name:'Reparatur',desc:'Türme kosten 5 % weniger',tier:2,cost:1,req:'bastion1'},
{id:'bastion3',region:'Bastion',name:'Turm-Wachstum',desc:'+10 % Turm-Schaden',tier:3,cost:2,req:'bastion2'},
{id:'bastion4',region:'Bastion',name:'Letzte Bastion',desc:'+15 % Turm-Reichweite',tier:4,cost:2,req:'bastion3'},
{id:'shadow1',region:'Schatten',name:'Flinke Schritte',desc:'+15 % Heldentempo',tier:1,cost:1},
{id:'shadow2',region:'Schatten',name:'Präzision',desc:'+10 % Schaden gegen Flieger',tier:2,cost:1,req:'shadow1'},
{id:'shadow3',region:'Schatten',name:'Giftklinge',desc:'+15 % Heldenschaden',tier:3,cost:2,req:'shadow2'},
{id:'shadow4',region:'Schatten',name:'Todesmarke',desc:'+25 % Schaden gegen Bosse',tier:4,cost:2,req:'shadow3'},
{id:'wealth1',region:'Reichtum',name:'Goldader',desc:'+10 % Gold aus Gegnern',tier:1,cost:1},
{id:'wealth2',region:'Reichtum',name:'Günstiger Bau',desc:'Türme kosten 5 % weniger',tier:2,cost:1,req:'wealth1'},
{id:'wealth3',region:'Reichtum',name:'Tintenzins',desc:'+10 Gold pro Welle',tier:3,cost:2,req:'wealth2'},
{id:'wealth4',region:'Reichtum',name:'Schatzkammer',desc:'+15 % Gold aus Gegnern',tier:4,cost:2,req:'wealth3'},
{id:'band1',region:'Band',name:'Gemeinsame Wache',desc:'+5 % Turm-Schaden',tier:1,cost:1},
{id:'band2',region:'Band',name:'Schild-Übertragung',desc:'+5 % Turm-Reichweite',tier:2,cost:1,req:'band1'},
{id:'band3',region:'Band',name:'Element-Brücke',desc:'+10 % Frost-Schaden',tier:3,cost:2,req:'band2'},
{id:'band4',region:'Band',name:'Vereinte Ultimative',desc:'+10 % Schaden gegen Bosse',tier:4,cost:2,req:'band3'}
];

function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function makePath(pts){let total=0,segs=[];for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],l=Math.hypot(b[0]-a[0],b[1]-a[1]);segs.push({a,b,l,s:total});total+=l}return{segs,total}}
const GP=makePath(ground),AP=makePath(air);
function pos(e){const P=e.route==='air'?AP:GP;let d=e.d;if(d>P.total)d=P.total;for(const s of P.segs){if(d<=s.s+s.l){const t=(d-s.s)/s.l;return{x:s.a[0]+(s.b[0]-s.a[0])*t,y:s.a[1]+(s.b[1]-s.a[1])*t}}}return{x:GP.segs.at(-1).b[0],y:GP.segs.at(-1).b[1]}}
function hpS(w){return Math.pow(1.175,w-1)}
function has(id){return !!skills[id]}
function heroDmg(e){let d=HERO[hero.cls].dmg;
if(has('blade1'))d*=1.10;if(has('arcane1'))d*=1.10;if(has('shadow3'))d*=1.15;
if(e){if(e.t==='tank'&&has('blade2'))d*=1.15;if(e.t==='flyer'&&has('shadow2'))d*=1.10;if(e.t==='boss'){if(has('shadow4'))d*=1.25;if(has('band4'))d*=1.10}}
return d}
function towerDamage(type,e){let d=T[type].d;
if(has('blade1'))d*=1.08;if(has('bastion3'))d*=1.10;if(has('band1'))d*=1.05;
if(type==='frost'){if(has('arcane4'))d*=1.20;if(has('band3'))d*=1.10}
if(type==='cannon'&&has('arcane3'))d*=1.15;
if(e){if(e.t==='tank'&&has('blade2'))d*=1.15;if(e.t==='flyer'&&has('shadow2'))d*=1.10;if(e.t==='boss'){if(has('shadow4'))d*=1.25;if(has('band4'))d*=1.10}}
return d}
function towerRange(type){let r=T[type].r;if(has('bastion1'))r*=1.10;if(has('bastion4'))r*=1.15;if(has('band2'))r*=1.05;return r}
function goldMult(){let m=1;if(has('wealth1'))m*=1.10;if(has('wealth4'))m*=1.15;return m}
function buildCost(type){let c=T[type].c;if(has('bastion2'))c*=.95;if(has('wealth2'))c*=.95;return Math.round(c)}
function frostSlow(){let s=.35;if(has('arcane2'))s+=.10;return s}
function setHero(cls){hero.cls=cls;hero.cd=0;void 0;ui()}
function useAbility(){if(!active || speed<=0 || lives<=0 || hero.cd>0)return;
if(hero.cls==='knight'){for(const e of enemies){if(e.route==='ground'&&dist(hero,pos(e))<130){e.slow=Math.max(e.slow,.6);hit(e,25,'hero')}}void 0}
else{for(const e of enemies){if(dist(hero,pos(e))<150){e.slow=Math.max(e.slow,frostSlow()+.2);hit(e,35,'hero')}}void 0}
hero.cd=HERO[hero.cls].cd;ui()}
function startWave(){if(lives<=0||active||wave>=waves.length)return;wave++;active=true;enemies=[];shots=[];queue=[];timer=0;let d=0;
if(has('wealth3'))gold+=10;
waves[wave-1].forEach(([t,n])=>{for(let i=0;i<n;i++){queue.push({t,d});d+=t==='runner'?.55:t==='flyer'?.7:.85}});ui()}
function build(t){if(active){void 0;return}const c=buildCost(t);if(gold<c){void 0;return}buildType=t;void 0}
cv.onclick=e=>{const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*(cv.width/r.width),y=(e.clientY-r.top)*(cv.height/r.height);
if(buildType){const c=buildCost(buildType);if(gold<c)return;if(near(x,y,26,ground)){void 0;return}gold-=c;towers.push({t:buildType,x,y,lvl:1,cd:0});void 0;buildType=null;ui();return}
hero.target={x,y};};
function near(x,y,r,pts){for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1],dx=b[0]-a[0],dy=b[1]-a[1],l2=dx*dx+dy*dy;let t=((x-a[0])*dx+(y-a[1])*dy)/l2;t=Math.max(0,Math.min(1,t));if(Math.hypot(x-(a[0]+dx*t),y-(a[1]+dy*t))<r)return true}return false}
function upgrade(){if(!sel)return;const c=Math.round(T[sel.t].c*.7*sel.lvl);if(gold<c){void 0;return}gold-=c;sel.lvl++;void 0;ui()}
/* INKFALL_MOVEMENT_FIX_V1 */
function spawn(t){
  const definition=E[t];
  if(!definition)throw new Error("Unbekannter Gegnertyp: "+t);

  const hp=t==='boss'?2500:definition.hp*hpS(wave);

  enemies.push({
    t,
    route:definition.route,
    d:0,
    hp,
    max:hp,
    slow:0,
    alive:true,
    shieldUp:t==='boss',
    healCd:0
  });
}

function hit(e,dmg,type){
if(!e || e.alive===false || e.hp<=0)return;
if(e.t==='boss'&&e.shieldUp&&type==='arrow')return;
let m=1;if(e.t==='tank'){m-=E.tank.armor;if(has('blade3'))m+=.10}
if(e.t==='shield'&&type==='arrow')m-=E.shield.shield;
if(e.t==='boss')m-=E.boss.armor;
e.hp-=dmg*Math.max(.2,m);
if(e.hp<=0){e.alive=false;const g=Math.round(E[e.t].g*goldMult());gold+=g;void 0;
if(e.t==='boss')void 0}}
function update(dt){
/* DIAG_GAME_HEARTBEAT */
window.inkfallDiag?.heartbeat();

/* INKFALL_PAUSE_FIX_V1 */
// Keine Kampfaktionen bei Pause oder ungültigem Zeitschritt.
// UI und der separate Zeichen-/Kameraloop bleiben aktiv.
if(!Number.isFinite(dt) || dt<=0 || speed<=0){
  ui();
  return;
}

// Eine verlorene Partie nicht weiter simulieren.
if(lives<=0){
  active=false;
  ui();
  return;
}

if(active){timer+=dt;while(queue.length&&queue[0].d<=timer){spawn(queue.shift().t)}
/* INKFALL_HERO_MOVEMENT_FIX_V2 */
if(hero.target && dt>0){
  const dx=hero.target.x-hero.x;
  const dy=hero.target.y-hero.y;
  const distance=Math.hypot(dx,dy);
  const movementSpeed=has('shadow1')?165:150;
  const step=movementSpeed*dt;

  if(distance<=step){
    // Ziel in diesem Schritt erreichbar:
    // exakt dort ankommen und Bewegungsauftrag abschließen.
    hero.x=hero.target.x;
    hero.y=hero.target.y;
    hero.target=null;
  }else{
    // Nur einen Teil der Reststrecke zurücklegen.
    hero.x+=dx/distance*step;
    hero.y+=dy/distance*step;
  }
}
hero.cd=Math.max(0,hero.cd-dt);hero.attackCd-=dt;
if(hero.attackCd<=0){let best=null,bd=1e9;for(const e of enemies){if(e.alive===false||e.hp<=0)continue;const p=pos(e),dd=dist(hero,p);if(dd<HERO[hero.cls].range&&dd<bd){bd=dd;best=e}}
if(best){hero.attackCd=HERO[hero.cls].rate;hit(best,heroDmg(best),'hero')}}
for(const e of enemies){if(e.alive===false||e.hp<=0)continue;let sp=E[e.t].s*40*(1-e.slow);if(e.t==='boss'&&e.hp/e.max<.3){sp*=1.3;if(!e.enraged){e.enraged=true;void 0}}
e.d+=sp*dt;e.slow=Math.max(0,e.slow-dt*.25);
if(E[e.t].healer){e.healCd-=dt;if(e.healCd<=0){e.healCd=2;for(const o of enemies){if(o!==e&&o.route==='ground'&&dist(pos(o),pos(e))<85&&o.hp<o.max)o.hp=Math.min(o.max,o.hp+18)}}}
if(e.d>=(e.route==='air'?AP.total:GP.total)){e.alive=false;lives-=E[e.t].dmg;void 0}}
enemies=enemies.filter(e=>e.hp>0&&e.alive!==false);
for(const t of towers){t.cd-=dt;if(t.cd>0)continue;const d=T[t.t],range=towerRange(t.t);let best=null,bd=-1;
for(const e of enemies){if(e.alive===false||e.hp<=0)continue;if(d.air&&e.route!=='air')continue;if(!d.air&&e.route==='air')continue;const p=pos(e);if(dist(t,p)<=range&&e.d>bd){bd=e.d;best=e}}
if(best){t.cd=d.rate;const p=pos(best);shots.push({x:t.x,y:t.y,e:best,dmg:towerDamage(t.t,best)*(1+.25*(t.lvl-1)),type:t.t,aoe:d.aoe,slow:t.t==='frost'?frostSlow():0})}}
for(const s of shots){
if(!s.e || s.e.alive===false || s.e.hp<=0){
  s.dead=true;
  continue;
}
/* INKFALL_PROJECTILE_HIT_FIX_V1 */
const p=pos(s.e);
const dx=p.x-s.x,dy=p.y-s.y;
const dd=Math.hypot(dx,dy);
const projectileStep=420*dt;
const hitRadius=12;

// Treffer, wenn das Geschoss bereits im Trefferbereich ist
// oder diesen mit seinem aktuellen Bewegungsschritt erreicht.
if(dd<=hitRadius+projectileStep){s.dead=true;
InkfallImpactFX.impact(s,p);

if(s.aoe){for(const e of enemies){if(e.route===s.e.route&&dist(pos(e),p)<=s.aoe)hit(e,s.dmg,s.type)}}else hit(s.e,s.dmg,s.type);
if(s.slow)s.e.slow=Math.max(s.e.slow,s.slow)}else{s.x+=dx/dd*420*dt;s.y+=dy/dd*420*dt}}
shots=shots.filter(s=>!s.dead);
if(!queue.length&&!enemies.length){active=false;skillPoints++;void 0;if(wave>=waves.length)void 0}}
if(lives<=0){active=false;void 0}
ui()}
function ui(){document.getElementById('lives').textContent=Math.max(0,lives);document.getElementById('gold').textContent=gold;document.getElementById('wave').textContent=wave+' / '+waves.length;document.getElementById('sp').textContent=skillPoints;document.getElementById('className').textContent=HERO[hero.cls].name;document.getElementById('ability').textContent=hero.cd>0?Math.ceil(hero.cd)+' s':'Bereit';document.getElementById('abilityBtn').textContent=HERO[hero.cls].ability+' ('+Math.ceil(hero.cd)+' s)';document.getElementById('abilityBtn').disabled=hero.cd>0 || !active || speed<=0 || lives<=0;document.getElementById('start').disabled=lives<=0||active||wave>=waves.length;document.getElementById('up').disabled=!sel;document.getElementById('up').textContent=sel?('Verbessern — '+Math.round(T[sel.t].c*.7*sel.lvl)+' G'):'Turm verbessern'}
function openTree(){document.getElementById('tree').classList.add('open');renderTree()}
function closeTree(){document.getElementById('tree').classList.remove('open')}
function renderTree(){const c=document.getElementById('treeContent');let html='';const regions=[...new Set(TREE.map(n=>n.region))];
for(const r of regions){html+='<div class="region"><h3>'+r+'</h3>';
for(const n of TREE.filter(n=>n.region===r)){const owned=has(n.id),locked=n.req&&!has(n.req),can=skillPoints>=n.cost&&!owned&&!locked;
html+='<div class="node '+(owned?'owned':locked?'locked':'')+'"><div><b>'+n.name+'</b><br><span style="opacity:.8">'+n.desc+'</span></div>';
html+=owned?'<span style="color:#b8860b">Aktiv</span>':'<button '+(can?'':'disabled')+' onclick="buy(\''+n.id+'\')">'+n.cost+' SP</button></div>'}
html+='</div>'}c.innerHTML=html}
function buy(id){const n=TREE.find(x=>x.id===id);if(!n||has(id))return;if(n.req&&!has(n.req))return;if(skillPoints<n.cost)return;skillPoints-=n.cost;skills[id]=true;void 0;renderTree();ui()}
function drawPath(pts,col){
  InkfallWorld.drawPath(ctx,pts,pts===air);
}

function draw(){ctx.clearRect(0,0,cv.width,cv.height);
/* INKFALL_WORLD_ART_V2 */
InkfallWorld.background(ctx,cv.width,cv.height,ground);
drawPath(ground,'#f8cf87');drawPath(air,'#88d8ee');
InkfallWorld.bastion(ctx,base.x,base.y);
/* INKFALL_TOWER_RENDERER_V1 */
for(const t of towers){
  InkfallTowerRenderer.draw(ctx,t,sel===t,towerRange(t.t));
}

for(const e of enemies){if(e.alive===false||e.hp<=0)continue;const p=pos(e);InkfallWorld.enemy(ctx,e,p.x,p.y,E[e.t].r,E[e.t].col);
if(e.t==='boss'&&e.shieldUp){ctx.strokeStyle='#3a6ea5';ctx.lineWidth=4;ctx.beginPath();ctx.arc(p.x,p.y,E[e.t].r+7,0,7);ctx.stroke()}
/* Lebensbalken zeichnet enemy-art.js. */}
/* INKFALL_ANIMATION_INTEGRATION_V2 */
InkfallCombatArt.renderHero(ctx);
/* INKFALL_PROJECTILE_ART_V1 */
for(const s of shots){
  InkfallImpactFX.projectile(ctx,s);
}

if(buildType){ctx.fillStyle='rgba(184,134,11,.25)';ctx.fillRect(0,0,cv.width,cv.height);ctx.fillStyle='#22201c';ctx.font='bold 18px Georgia';ctx.fillText(T[buildType].n+' platzieren',cv.width/2,40)}
InkfallCombatArt.frame(ctx);
InkfallEnemyArt.frame(ctx);
InkfallImpactFX.frame(ctx);
requestAnimationFrame(draw)}
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000)*speed;last=now;update(dt);requestAnimationFrame(loop)}
ui();draw();requestAnimationFrame(loop);void 0;
</script>
