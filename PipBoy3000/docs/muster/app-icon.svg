<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    Pip-Boy 3003 - Vault-Tuer

    DIESE DATEI IST DIE QUELLE DES MOTIVS. Zwei Stellen lesen sie:

      tools/app-icon.mjs   rastert daraus Icon, Favicon und die
                           ausgelieferte icon.svg
      src/ui/ui_emblem.js  zeichnet dieselben Formen gross im Boot-Screen
                           (ui_emblem.js ist erzeugt - nicht von Hand aendern)

    Nach jeder Aenderung:   npm run bilder

    Aufbau von aussen nach innen, wie an einer echten Vault-Tuer:
      1. acht Verriegelungsbolzen am Rand - kurz und breit, damit sie bei
         16 px nicht zu Staub zerfallen
      2. die Scheibe
      3. Nut-Ring knapp innen (nur in der grossen Fassung; bei 16 px wuerde
         er die Flaeche in zwei duenne Ringe zerlegen)
      4. drei massive Speichen - sie machen aus dem Zahnrad eine Tuer
      5. Nabe mit Kernloch

    Das alte Motiv war eine Zielscheibe: gleichmaessige Ringe und ein Punkt in
    der Mitte. Marcel: "Das Logo ist haesslich." Eine Zielscheibe ist kein
    Vault. Bolzen, Speichen und Kernloch sind es.

    Geometrie (dieselben Zahlen stehen in tools/app-icon.mjs als MOTIV und in
    tools/emblem.mjs als QUELLE):
      Scheibe r=44 | Bolzen r=38..48.5, Breite 9 | Nut-Ring 38..41
      Speichen 90/210/330 Grad, Breite 10, aussen r=39 | Nabe r=12 | Kernloch r=5
  -->
  <rect width="100" height="100" fill="#000000"/>

  <!-- Ab 120 px: mit Nut-Ring, der die Tuer eine Stufe dreidimensionaler macht -->
  <g id="gross">
    <g fill="#39ff14">
      <rect x="45.5" y="3" width="9" height="8" transform="rotate(0 50 50)"/>
      <rect x="45.5" y="3" width="9" height="8" transform="rotate(45 50 50)"/>
      <rect x="45.5" y="3" width="9" height="8" transform="rotate(90 50 50)"/>
      <rect x="45.5" y="3" width="9" height="8" transform="rotate(135 50 50)"/>
      <rect x="45.5" y="3" width="9" height="8" transform="rotate(180 50 50)"/>
      <rect x="45.5" y="3" width="9" height="8" transform="rotate(225 50 50)"/>
      <rect x="45.5" y="3" width="9" height="8" transform="rotate(270 50 50)"/>
      <rect x="45.5" y="3" width="9" height="8" transform="rotate(315 50 50)"/>
    </g>
    <circle cx="50" cy="50" r="44" fill="#39ff14"/>
    <circle cx="50" cy="50" r="39.5" fill="none" stroke="#000000" stroke-width="3"/>
    <g fill="#000000">
      <rect x="45" y="11" width="10" height="28" transform="rotate(90 50 50)"/>
      <rect x="45" y="11" width="10" height="28" transform="rotate(210 50 50)"/>
      <rect x="45" y="11" width="10" height="28" transform="rotate(330 50 50)"/>
    </g>
    <circle cx="50" cy="50" r="12" fill="#39ff14"/>
    <circle cx="50" cy="50" r="5" fill="#000000"/>
  </g>

  <!-- 64-119 px: ohne Nut-Ring, kraeftigere Speichen und groessere Nabe -
       sonst verschwinden sie beim Verkleinern zuerst -->
  <g id="mittel">
    <g fill="#39ff14">
      <rect x="44" y="1.5" width="12" height="11.5" transform="rotate(0 50 50)"/>
      <rect x="44" y="1.5" width="12" height="11.5" transform="rotate(45 50 50)"/>
      <rect x="44" y="1.5" width="12" height="11.5" transform="rotate(90 50 50)"/>
      <rect x="44" y="1.5" width="12" height="11.5" transform="rotate(135 50 50)"/>
      <rect x="44" y="1.5" width="12" height="11.5" transform="rotate(180 50 50)"/>
      <rect x="44" y="1.5" width="12" height="11.5" transform="rotate(225 50 50)"/>
      <rect x="44" y="1.5" width="12" height="11.5" transform="rotate(270 50 50)"/>
      <rect x="44" y="1.5" width="12" height="11.5" transform="rotate(315 50 50)"/>
    </g>
    <circle cx="50" cy="50" r="44" fill="#39ff14"/>
    <g fill="#000000">
      <rect x="41" y="18" width="18" height="26" transform="rotate(90 50 50)"/>
      <rect x="41" y="18" width="18" height="26" transform="rotate(210 50 50)"/>
      <rect x="41" y="18" width="18" height="26" transform="rotate(330 50 50)"/>
    </g>
    <circle cx="50" cy="50" r="14" fill="#39ff14"/>
    <circle cx="50" cy="50" r="6.5" fill="#000000"/>
  </g>
</svg>
