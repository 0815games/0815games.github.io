<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    Pip-Boy 3003 - App-Icon (zackige Vault-Tuer)

    DIESE DATEI IST DIE QUELLE ALLER ICON-GROESSEN.
    tools/app-icon.mjs rastert sie und schreibt PNG, ICO und die ausgelieferte
    SVG-Fassung. Nach jeder Aenderung:   npm run icons:app

    Vorbild ist die Vault-Tuer: acht zackige Zaehne am Rand (Trapeze, keine
    Rechtecke), ein dunkler Kranz mit acht Speichen, eine achteckige
    Innenplatte und in der Mitte das Messingschild mit der Nummer 33.

    Zwei Fassungen:
      ab 64 px   grosse Fassung mit Achteck-Platte und Nummer 33
      darunter   kraeftige Fassung ohne Achteck und ohne Nummer. Die 33 waere
                 bei 16 px vier Pixel breit - ein Fleck, keine Ziffer.

    Unter 64 px zeichnet tools/app-icon.mjs die Pixelformel, mit denselben
    Massen wie die kraeftige Fassung: Zahnkranz r=34..50 (aussen 26 Grad breit,
    an der Kante 40), dunkler Ring 23..31, acht Speichen, Messing r=19.
  -->
