<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    Pip-Boy 3003 - App-Icon

    DIESE DATEI IST DIE QUELLE ALLER ICON-GROESSEN.
    tools/app-icon.mjs rastert sie und schreibt PNG, ICO und die ausgelieferte
    SVG-Fassung. Nach jeder Aenderung:   npm run icons:app

    Das Motiv ist das des Lade-Kreisels vom Startbildschirm: zwei gruene
    Boegen oben und unten (der drehende Ring), ein gelber Punktkranz innen
    (der gegenlaeufige Ring) und in der Mitte der Reaktor - dunkle Scheibe,
    gruener Ring, gruener Kern.

    Zwei Fassungen, weil ein Motiv allein nicht in jeder Groesse traegt:
      ab 64 px    <g id="gross">  mit Punktkranz
      darunter    <g id="mittel"> ohne Punkte, aber mit dickeren Boegen und
                                  einem vollen gelben Ring. Zwoelf Punkte auf
                                  16 px waeren zwoelf einzelne Pixel.
    Unter 64 px keine SVG-Ableitung, sondern die Pixelformel in
    tools/app-icon.mjs - dieselben Massen wie im mittleren Zweig.

    Zur Geschichte, damit es niemand wieder einbaut: vorher war das Motiv eine
    Zielscheibe aus gleichmaessigen Ringen, dann kurz eine Vault-Tuer. Beides
    war nicht das, was auf dem Startbildschirm steht. Das Icon zeigt jetzt, was
    das Spiel zeigt.
  -->
  <rect width="100" height="100" fill="#000000"/>

  <!-- Ab 64 px: mit Punktkranz und duennem Innenring -->
  <g id="gross">
      <path d="M10.40 39.39A41 41 0 0 1 89.60 39.39" fill="none" stroke="#39ff14" stroke-width="8" stroke-linecap="round"/>
      <path d="M89.60 60.61A41 41 0 0 1 10.40 60.61" fill="none" stroke="#39ff14" stroke-width="8" stroke-linecap="round"/>
      <circle cx="50.00" cy="18.50" r="2.1" fill="#eab308"/>
      <circle cx="65.75" cy="22.72" r="2.1" fill="#eab308"/>
      <circle cx="77.28" cy="34.25" r="2.1" fill="#eab308"/>
      <circle cx="81.50" cy="50.00" r="2.1" fill="#eab308"/>
      <circle cx="77.28" cy="65.75" r="2.1" fill="#eab308"/>
      <circle cx="65.75" cy="77.28" r="2.1" fill="#eab308"/>
      <circle cx="50.00" cy="81.50" r="2.1" fill="#eab308"/>
      <circle cx="34.25" cy="77.28" r="2.1" fill="#eab308"/>
      <circle cx="22.72" cy="65.75" r="2.1" fill="#eab308"/>
      <circle cx="18.50" cy="50.00" r="2.1" fill="#eab308"/>
      <circle cx="22.72" cy="34.25" r="2.1" fill="#eab308"/>
      <circle cx="34.25" cy="22.72" r="2.1" fill="#eab308"/>
      <circle cx="50" cy="50" r="23" fill="#001100" stroke="#39ff14" stroke-width="2"/>
      <circle cx="50" cy="50" r="10" fill="#39ff14"/>
  </g>

  <!-- Kleine Fassungen: kraeftiger, ohne Punktkranz -->
  <g id="mittel">
      <path d="M14.65 33.52A39 39 0 0 1 85.35 33.52" fill="none" stroke="#39ff14" stroke-width="15" stroke-linecap="round"/>
      <path d="M85.35 66.48A39 39 0 0 1 14.65 66.48" fill="none" stroke="#39ff14" stroke-width="15" stroke-linecap="round"/>
      <circle cx="50" cy="50" r="27" fill="none" stroke="#eab308" stroke-width="8"/>
      <circle cx="50" cy="50" r="22" fill="#001100" stroke="#39ff14" stroke-width="1.6"/>
      <circle cx="50" cy="50" r="12" fill="#39ff14"/>
  </g>
</svg>
