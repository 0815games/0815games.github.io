<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    Pip-Boy 3003 - App-Icon (Vault-Tuer)

    DIESE DATEI IST DIE QUELLE ALLER ICON-GROESSEN.
    tools/app-icon.mjs rastert sie und schreibt PNG, ICO und die ausgelieferte
    SVG-Fassung. Wer hier etwas aendert, muss `npm run icons:app` laufen lassen.

    Drei Fassungen, weil ein Motiv allein nicht in jeder Groesse funktioniert:

      ab 120 px   grosse Fassung  (dieser Zweig, <g id="gross">)
      64-119 px   mittlere Fassung (<g id="mittel">)
      unter 64 px keine SVG-Ableitung, sondern die Pixelformel in
                  tools/app-icon.mjs. Grund: bei 16 px ist ein Strich von
                  2.4 Einheiten 0.38 px und wird beim Weichzeichnen zu Matsch.
                  Dort entscheidet pro Pixel eine Formel - keine Graustufen.

    Damit die Groessen nicht auseinanderlaufen, beschreiben beide Zweige hier
    und die Formel im Werkzeug dieselben Radien:
      Scheibe r=45 | Trennring 28..35 | Kernloch r=9 | Schlitze ab r=35

    Das alte Masken-Icon scheiterte an genau diesem Punkt: duenne Striche,
    ein Strahlensymbol als Fleck in der Mitte, ein Filter, der bei 16 px zu
    einem Kuchen verschmolz. Hier ist alles massiv - Farbflaeche statt Linie.
  -->
  <rect width="100" height="100" fill="#000000"/>

  <!-- Ab 120 px: mit Innenring, der die Tuer eine Stufe dreidimensionaler macht -->
  <g id="gross">
    <circle cx="50" cy="50" r="45" fill="#39ff14"/>
    <circle cx="50" cy="50" r="36.5" fill="none" stroke="#000000" stroke-width="1.8"/>
    <circle cx="50" cy="50" r="31.5" fill="none" stroke="#000000" stroke-width="7"/>
    <circle cx="50" cy="50" r="9" fill="#000000"/>
    <g fill="#000000">
      <rect x="46.5" y="6" width="7" height="16" transform="rotate(0 50 50)"/>
      <rect x="46.5" y="6" width="7" height="16" transform="rotate(60 50 50)"/>
      <rect x="46.5" y="6" width="7" height="16" transform="rotate(120 50 50)"/>
      <rect x="46.5" y="6" width="7" height="16" transform="rotate(180 50 50)"/>
      <rect x="46.5" y="6" width="7" height="16" transform="rotate(240 50 50)"/>
      <rect x="46.5" y="6" width="7" height="16" transform="rotate(300 50 50)"/>
    </g>
  </g>

  <!-- 64-119 px: ohne Innenring, kraeftigerer Trennring - sonst verschwindet
       er beim Verkleinern zuerst -->
  <g id="mittel">
    <circle cx="50" cy="50" r="45" fill="#39ff14"/>
    <circle cx="50" cy="50" r="31.5" fill="none" stroke="#000000" stroke-width="7"/>
    <circle cx="50" cy="50" r="9" fill="#000000"/>
    <g fill="#000000">
      <rect x="46.5" y="6" width="7" height="16" transform="rotate(0 50 50)"/>
      <rect x="46.5" y="6" width="7" height="16" transform="rotate(60 50 50)"/>
      <rect x="46.5" y="6" width="7" height="16" transform="rotate(120 50 50)"/>
      <rect x="46.5" y="6" width="7" height="16" transform="rotate(180 50 50)"/>
      <rect x="46.5" y="6" width="7" height="16" transform="rotate(240 50 50)"/>
      <rect x="46.5" y="6" width="7" height="16" transform="rotate(300 50 50)"/>
    </g>
  </g>
</svg>
