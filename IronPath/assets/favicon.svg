<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Iron Path">
  <!-- Full-bleed icon matching the painted master: an iron cross pattée with
       a silver rim and the gold field star on the olive battlefield. -->
  <rect width="64" height="64" fill="#344b36"/>
  <ellipse cx="16" cy="10" rx="11" ry="6" fill="#3d5740"/>
  <ellipse cx="50" cy="14" rx="9" ry="5" fill="#2c4030"/>
  <ellipse cx="8" cy="52" rx="8" ry="5" fill="#2c4030"/>
  <ellipse cx="55" cy="55" rx="10" ry="6" fill="#3d5740"/>
  <ellipse cx="50" cy="59" rx="4" ry="2.4" fill="#6a6d5f"/>
  <ellipse cx="10" cy="24" rx="3" ry="2" fill="#565a4c"/>
  <ellipse cx="54" cy="44" rx="2.6" ry="1.8" fill="#565a4c"/>
  <!-- iron cross pattée: arms flare wide at the ends, pinched at the center -->
  <path d="M22 8 H42 L37 27 L56 22 V42 L37 37 L42 56 H22 L27 37 L8 42 V22 L27 27 Z"
        fill="#1d2120" stroke="#d9dde1" stroke-width="3.5" stroke-linejoin="miter"/>
  <path d="M22 8 H42 L37 27 L56 22 V42 L37 37 L42 56 H22 L27 37 L8 42 V22 L27 27 Z"
        fill="none" stroke="#3f4440" stroke-width="1.1" stroke-linejoin="miter"
        transform="translate(32 32) scale(0.78) translate(-32 -32)"/>
  <!-- the gold field star at the heart of the cross -->
  <path d="M32 26 L33.41 30.06 L37.71 30.15 L34.28 32.74 L35.53 36.85 L32 34.4 L28.47 36.85 L29.72 32.74 L26.29 30.15 L30.59 30.06 Z"
        fill="#f0d68a" stroke="#1f3024" stroke-width="1" stroke-linejoin="round"/>
</svg>
