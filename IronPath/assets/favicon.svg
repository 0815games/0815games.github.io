<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Iron Path">
  <!-- The icon of the field transmission: the captain's mark - one gold star
       over two chevrons - on the dark olive plate of the loading scene and the
       intro. Same stencil gold, same shapes the soldier wears as a rank, so
       the favicon, the home screen and the uniform tell one story. -->
  <rect width="64" height="64" fill="#14241e"/>
  <ellipse cx="14" cy="9" rx="12" ry="6" fill="#1b2f26"/>
  <ellipse cx="52" cy="13" rx="9" ry="5" fill="#0f1c16"/>
  <ellipse cx="7" cy="54" rx="9" ry="5" fill="#0f1c16"/>
  <ellipse cx="55" cy="56" rx="11" ry="6" fill="#1b2f26"/>
  <ellipse cx="10" cy="26" rx="3.2" ry="2" fill="#24392e"/>
  <ellipse cx="55" cy="42" rx="2.8" ry="1.9" fill="#24392e"/>
  <!-- the gold field star -->
  <path d="M32 11.5 L34.4 18.3 L41.6 18.5 L35.9 22.9 L37.9 29.8 L32 25.9 L26.1 29.8 L28.1 22.9 L22.4 18.5 L29.6 18.3 Z"
        fill="#e4ca89" stroke="#1f3024" stroke-width="1" stroke-linejoin="round"/>
  <!-- two enlisted chevrons under the star -->
  <path d="M14 33 L32 23.5 L50 33 L50 40 L32 30.5 L14 40 Z"
        fill="#e4ca89" stroke="#1f3024" stroke-width="1" stroke-linejoin="miter"/>
  <path d="M14 45 L32 35.5 L50 45 L50 52 L32 42.5 L14 52 Z"
        fill="#e4ca89" stroke="#1f3024" stroke-width="1" stroke-linejoin="miter"/>
</svg>
